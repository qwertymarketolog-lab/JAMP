name: Assemble Historical JAMP Tree

on:
  push:
    branches:
      - 'import/jamp-from-visual-merchant-hub'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: import/jamp-from-visual-merchant-hub

      - name: Fetch exact upstream baseline
        run: |
          rm -rf /tmp/visual-merchant-hub /tmp/jamp-source.tar.gz
          curl --fail --location --retry 3 \
            -o /tmp/jamp-source.tar.gz \
            https://codeload.github.com/qwertymarketolog-lab/visual-merchant-hub/tar.gz/7b717a8dea269bc5c33d9c128634f55c0bad27b0
          mkdir -p /tmp/visual-merchant-hub
          tar -xzf /tmp/jamp-source.tar.gz --strip-components=1 -C /tmp/visual-merchant-hub
          test "$(git -C /tmp/visual-merchant-hub rev-parse HEAD 2>/dev/null || true)" = "" || true

      - name: Verify source anchor
        run: |
          test -f /tmp/visual-merchant-hub/src/jamp/p18/controlled_transfer.py
          test -f /tmp/visual-merchant-hub/src/jamp/p18/experiment_registry.py
          test -f /tmp/visual-merchant-hub/src/jamp/search/boundary.py
          test -f /tmp/visual-merchant-hub/src/jamp/registry/registry.py
          test -f /tmp/visual-merchant-hub/tests/test_p18_4_ablation.py

      - name: Assemble historical JAMP tree
        run: |
          cp tests/test_architectural_boundaries.py /tmp/test_architectural_boundaries.py
          rm -rf src/jamp tests integration pytest.ini
          cp -a /tmp/visual-merchant-hub/src/jamp src/jamp
          cp -a /tmp/visual-merchant-hub/tests tests
          cp -a /tmp/visual-merchant-hub/integration integration
          cp /tmp/visual-merchant-hub/pytest.ini pytest.ini
          cp /tmp/test_architectural_boundaries.py tests/test_architectural_boundaries.py

      - name: Commit coherent candidate
        run: |
          git config user.name "qwertymarketolog-lab"
          git config user.email "qwertymarket@gmail.com"
          git add src/jamp tests integration pytest.ini
          git diff --cached --quiet && exit 0
          git commit -m "import: assemble historical upstream 7b717a8"
          git push origin HEAD:import/jamp-from-visual-merchant-hub
