name: Verify make lint

on:
  workflow_dispatch:
  push:
    branches: [feat/501-make-lint]
    paths: ['.github/workflows/verify-make-lint.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Verify Ruff version
        run: ruff --version

      - name: Run make lint
        run: |
          set +e
          make lint
          EXIT_CODE=$?
          echo "LINT_EXIT_CODE=$EXIT_CODE" >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE
