name: Frontend Playwright E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "src/jamp/api/**"
      - "src/jamp/server/web/**"
      - ".github/workflows/frontend-playwright-e2e.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src/jamp/api/**"
      - "src/jamp/server/web/**"
      - ".github/workflows/frontend-playwright-e2e.yml"

permissions:
  contents: read

jobs:
  frontend-playwright-e2e:
    name: Frontend Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install backend and E2E server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "uvicorn[standard]>=0.30,<1"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-e2e
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
