name: Developer Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project without runtime dependencies
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Run architectural isolation tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_architectural_boundaries.py
      - name: Run full test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Ruff (when installed in the runner environment)
        run: |
          if command -v ruff >/dev/null 2>&1; then ruff check . && ruff format --check .; else echo "ruff not preinstalled; local pre-commit remains authoritative"; fi
      - name: Mypy (when installed in the runner environment)
        run: |
          if command -v mypy >/dev/null 2>&1; then mypy; else echo "mypy not preinstalled; local pre-commit remains authoritative"; fi
      - name: Baseline integrity
        run: python tools/check_baseline.py --baseline "$(head -n 1 .jamp-baseline)"
