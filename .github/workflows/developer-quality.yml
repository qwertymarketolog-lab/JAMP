name: Developer Quality

on:
  pull_request:
    branches: [main, 'research/**']
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch target base branch
        run: git fetch origin main --no-tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install isolated developer environment
        run: python -m pip install ".[dev]"
      - name: Run architectural isolation tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_architectural_boundaries.py
      - name: Run full test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q -m "not exp19_perf"
      - name: Run Phase A runner self-tests
        env:
          PYTHONPATH: .agents/runner
        run: python -m pytest -q .agents/runner/test_phase_a.py
      - name: Run EXP-18 R1 DAG query target tests
        env:
          PYTHONPATH: src
        run: python -m pytest -v tests/research/exp18/test_dag_query.py
      - name: Run EXP-18 R2.1 audit export target tests
        env:
          PYTHONPATH: src
        run: python -m pytest -v tests/research/exp18/test_audit_export.py
      - name: Run Ruff with baseline
        run: make lint

      - name: Mypy changed Python files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.py')
          if ((${#files[@]})); then
            root_files=()
            src_files=()
            template_files=()

            for file in "${files[@]}"; do
              case "$file" in
                templates/jamp-plugin/*)
                  template_files+=("${file#templates/jamp-plugin/}")
                  ;;
                src/jamp/*)
                  src_files+=("$file")
                  ;;
                tools/*|experiments/the-hunt/code-audit/*)
                  root_files+=("$file")
                  ;;
              esac
            done

            if ((${#root_files[@]})); then
              MYPYPATH=src mypy --config-file=/dev/null --strict --follow-imports=skip --python-version 3.11 "${root_files[@]}"
            fi

            if ((${#src_files[@]})); then
              MYPYPATH=src mypy --config-file=pyproject.toml "${src_files[@]}"
            fi

            if ((${#template_files[@]})); then
              (
                cd templates/jamp-plugin
                MYPYPATH=src mypy src/jamp_plugin
                if printf '%s\n' "${template_files[@]}" | grep -qx 'tests/test_engine.py'; then
                  MYPYPATH=src mypy tests/test_engine.py
                fi
              )
            fi
          else
            echo "No Python files changed."
          fi
      - name: Baseline integrity
        run: python tools/check_baseline.py --baseline "$(head -n 1 .jamp-baseline)"