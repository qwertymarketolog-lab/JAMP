name: Developer Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install isolated developer environment
        run: python -m pip install ".[dev]"
      - name: Run architectural isolation tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_architectural_boundaries.py
      - name: Run full test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy
      - name: Baseline integrity
        run: python tools/check_baseline.py --baseline "$(head -n 1 .jamp-baseline)"
