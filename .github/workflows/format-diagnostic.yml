name: format-diagnostic (temporary)

on:
  workflow_dispatch:
  push:
    branches: [feat/501-make-lint]
    paths:
      - ".github/workflows/format-diagnostic.yml"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pinned developer tooling
        run: python -m pip install ".[dev]"
      - name: Verify Ruff and generate patch
        shell: bash
        run: |
          set -euo pipefail
          ruff --version | tee ruff-version.txt
          grep -qx 'ruff 0.17.3' ruff-version.txt
          printf '%s\n' "${GITHUB_SHA}" > base-sha.txt

          ruff format .
          git diff --name-only -- '*.py' > formatted-files.txt
          git diff --binary -- '*.py' > ruff-format.patch
          git diff --stat -- '*.py' > ruff-format-stat.txt

          count="$(wc -l < formatted-files.txt | tr -d ' ')"
          printf 'FORMATTED_FILE_COUNT=%s\n' "$count" | tee format-summary.txt
          printf 'FROZEN_CORE_DELTA=' >> format-summary.txt
          if git diff --quiet -- src/jamp/run.py; then
            printf '0\n' | tee -a format-summary.txt
          else
            printf 'NONZERO\n' | tee -a format-summary.txt
            exit 1
          fi

          test "$count" -eq 83
          git diff --check
      - name: Upload formatting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format-diff
          if-no-files-found: error
          path: |
            ruff-format.patch
            formatted-files.txt
            ruff-format-stat.txt
            format-summary.txt
            ruff-version.txt
            base-sha.txt
