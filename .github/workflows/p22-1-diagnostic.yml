name: P22.1 Diagnostic

on:
  push:
    branches:
      - feature/p22-1-search-space
  pull_request:
    branches:
      - feature/p22-1-search-space

jobs:
  p22-1-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up CPython 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Run P22.1 contract gates
        run: python -m pytest -q tests/research/test_search_space.py
