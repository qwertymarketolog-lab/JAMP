name: EXP G4 Chainguard MinIO Compatibility

on:
  pull_request:
    branches: [main]

jobs:
  g4-chainguard-compat:
    runs-on: ubuntu-latest
    services:
      minio:
        image: cgr.dev/chainguard/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        command: server /data --address :9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Configure MinIO bucket
        run: |
          python -m pip install boto3
          python - <<'PY'
          import boto3
          from botocore.config import Config
          client = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              aws_access_key_id="minioadmin",
              aws_secret_access_key="minioadmin",
              region_name="us-east-1",
              config=Config(s3={"addressing_style": "path"}),
          )
          try:
              client.create_bucket(Bucket="jamp-g4")
              print("bucket create status=200")
          except client.exceptions.BucketAlreadyOwnedByYou:
              print("bucket create status=409")
          PY
      - name: Run G4 runtime test
        env:
          JAMP_G4_MINIO_ENDPOINT: http://127.0.0.1:9000
          JAMP_G4_MINIO_BUCKET: jamp-g4
          JAMP_G4_EVIDENCE_PATH: artifacts/g4-runtime-evidence.json
        run: python -m pytest -q tests/test_g4_minio_runtime.py
      - name: Upload G4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-chainguard-compat-evidence
          path: artifacts/g4-runtime-evidence.json
          if-no-files-found: warn
