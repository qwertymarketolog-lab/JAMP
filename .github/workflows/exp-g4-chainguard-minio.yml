name: EXP G4 Chainguard MinIO Compatibility

on:
  pull_request:
    branches: [main]

jobs:
  g4-chainguard-compat:
    runs-on: ubuntu-latest
    services:
      minio:
        image: cgr.dev/chainguard/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        command: server /data --address :9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Configure MinIO bucket
        run: |
          python - <<'PY'
          import httpx
          response = httpx.put(
              "http://127.0.0.1:9000/jamp-g4",
              timeout=10.0,
              auth=("minioadmin", "minioadmin"),
          )
          if response.status_code not in (200, 204, 409):
              raise SystemExit(f"bucket create failed: {response.status_code} {response.text}")
          print(f"bucket create status={response.status_code}")
          PY
      - name: Run G4 runtime test
        env:
          JAMP_G4_MINIO_ENDPOINT: http://127.0.0.1:9000
          JAMP_G4_MINIO_BUCKET: jamp-g4
          JAMP_G4_EVIDENCE_PATH: artifacts/g4-runtime-evidence.json
        run: python -m pytest -q tests/test_g4_minio_runtime.py
      - name: Upload G4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-chainguard-compat-evidence
          path: artifacts/g4-runtime-evidence.json
          if-no-files-found: warn
