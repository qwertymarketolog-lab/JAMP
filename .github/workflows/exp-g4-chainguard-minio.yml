name: EXP G4 Chainguard MinIO Compatibility

on:
  pull_request:
    branches: [main]

jobs:
  g4-chainguard-compat:
    runs-on: ubuntu-latest
    services:
      minio:
        image: cgr.dev/chainguard/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        command: server /data --address :9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Configure MinIO bucket
        run: |
          python - <<'PY'
          import base64
          import urllib.error
          import urllib.request
          request = urllib.request.Request("http://127.0.0.1:9000/jamp-g4", method="PUT")
          token = base64.b64encode(b"minioadmin:minioadmin").decode()
          request.add_header("Authorization", "Basic " + token)
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  status = response.status
          except urllib.error.HTTPError as exc:
              status = exc.code
              if status != 409:
                  raise
          if status not in (200, 204, 409):
              raise SystemExit(f"bucket create failed: {status}")
          print(f"bucket create status={status}")
          PY
      - name: Run G4 runtime test
        env:
          JAMP_G4_MINIO_ENDPOINT: http://127.0.0.1:9000
          JAMP_G4_MINIO_BUCKET: jamp-g4
          JAMP_G4_EVIDENCE_PATH: artifacts/g4-runtime-evidence.json
        run: python -m pytest -q tests/test_g4_minio_runtime.py
      - name: Upload G4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-chainguard-compat-evidence
          path: artifacts/g4-runtime-evidence.json
          if-no-files-found: warn
