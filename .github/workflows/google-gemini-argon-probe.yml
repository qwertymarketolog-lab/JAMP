name: Google Gemini Argon API Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-api-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one-request Google API probe
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        run: python scripts/research/google_gemini_argon_probe.py

      - name: Upload raw Google API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-gemini-argon-api-probe
          path: artifacts/research/google_gemini_argon_probe/
          if-no-files-found: error
          retention-days: 30
