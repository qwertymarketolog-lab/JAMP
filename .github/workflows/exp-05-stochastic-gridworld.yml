name: EXP-05 stochastic Gridworld

on:
  push:
    branches:
      - feature/exp-05-stochastic-gridworld
  workflow_dispatch:

jobs:
  exp05:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Verify Run Core blob SHA-1
        env:
          EXPECTED_CORE_BLOB_SHA: 0fee0e1c5c1a1548361965ac51eacdeba62bfe8a
        run: |
          actual="$(git hash-object src/jamp/run.py)"
          test "$actual" = "$EXPECTED_CORE_BLOB_SHA"
          echo "Run Core blob SHA-1: $actual"

      - name: Run EXP-05 tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/research/test_exp05_stochastic_gridworld.py
