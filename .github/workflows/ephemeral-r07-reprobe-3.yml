name: Ephemeral R07 Reprobe 3 v1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ephemeral-r07-reprobe-3.yml"

permissions:
  contents: read

jobs:
  r07-reprobe-3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact original R07 target SHA
        uses: actions/checkout@v4
        with:
          ref: 56e8676114c91a1384334e8297ecda8902f5485f

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Probe exactly the 3 inconclusive models
        env:
          ANYMODEL_API_KEY: ${{ secrets.ANYMODEL_API_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          from pathlib import Path

          import requests

          TARGET = "56e8676114c91a1384334e8297ecda8902f5485f"
          MODELS = [
              "ag/gemini-pro-agent",
              "am/kimi-k3",
              "cc/claude-opus-4-7",
          ]
          PROMPT = "Reply with exactly: OK"
          key = os.environ.get("ANYMODEL_API_KEY")
          if not key:
              raise SystemExit("ANYMODEL_API_KEY is required")

          headers = {"Authorization": f"Bearer {key}"}
          chat_url = "https://anymodel.org/v1/chat/completions"
          results = []

          for i, model in enumerate(MODELS, 1):
              started = time.perf_counter()
              try:
                  response = requests.post(
                      chat_url,
                      headers={**headers, "Content-Type": "application/json"},
                      json={
                          "model": model,
                          "messages": [{"role": "user", "content": PROMPT}],
                          "temperature": 0,
                      },
                      timeout=30,
                  )
                  elapsed = time.perf_counter() - started
                  try:
                      body = response.json()
                  except ValueError:
                      body = {"raw_text": response.text[:4000]}

                  choices = body.get("choices") if isinstance(body, dict) else None
                  text = None
                  if isinstance(choices, list) and choices and isinstance(choices[0], dict):
                      message = choices[0].get("message")
                      if isinstance(message, dict) and isinstance(message.get("content"), str):
                          text = message["content"]
                      elif isinstance(choices[0].get("text"), str):
                          text = choices[0]["text"]

                  results.append({
                      "model_id": model,
                      "status": "VERIFIED" if text == "OK" else "INCONCLUSIVE",
                      "observed": {
                          "status_code": response.status_code,
                          "elapsed_s": elapsed,
                          "text": text,
                          "response_body": body,
                      },
                  })
              except requests.RequestException as exc:
                  results.append({
                      "model_id": model,
                      "status": "INCONCLUSIVE",
                      "observed": {
                          "error_type": type(exc).__name__,
                          "error": str(exc),
                          "response_body": None,
                      },
                  })
              print(f"[{i}/3] {model} -> {results[-1]['status']}", flush=True)

          payload = {
              "schema_version": "jamp.r07.raw_runtime_reprobe_3.v1",
              "target_commit": TARGET,
              "probe": "R07-reprobe-3",
              "candidate_count": len(MODELS),
              "prompt": PROMPT,
              "chat_url": chat_url,
              "created_at": dt.datetime.now(dt.UTC).isoformat().replace("+00:00", "Z"),
              "source_raw_artifact_unchanged": True,
              "results": results,
          }
          out = Path("artifacts/research/raw_r07_runtime_reprobe_3_v1.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"WROTE {out}", flush=True)
          PY

      - name: Upload separate reprobe evidence
        uses: actions/upload-artifact@v4
        with:
          name: raw-r07-runtime-reprobe-3-v1
          path: artifacts/research/raw_r07_runtime_reprobe_3_v1.json
          if-no-files-found: error
          retention-days: 30
