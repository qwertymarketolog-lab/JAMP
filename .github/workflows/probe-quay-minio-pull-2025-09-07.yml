name: Probe Quay MinIO public candidate

on:
  push:
    branches:
      - probe/quay-minio-pull-2025-09-07

jobs:
  docker-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull exact public MinIO candidate from Quay
        run: |
          set -euxo pipefail
          docker pull quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          docker image inspect quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            --format='repo={{index .RepoTags 0}} digests={{json .RepoDigests}}'
