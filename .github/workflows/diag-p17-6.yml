name: Diagnostic P17.6 CLI

on:
  push:
    branches:
      - 'diag/p17-6-cli-stderr'

permissions:
  contents: read

jobs:
  p17-6-cli:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest

      - name: Run targeted P17.6 diagnostic
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_p17_6_cli_entrypoints.py
