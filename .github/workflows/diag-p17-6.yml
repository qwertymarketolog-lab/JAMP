name: Diagnostic P17.6 CLI

on:
  workflow_dispatch:
  push:
    branches:
      - 'diag/p17-6-cli-stderr'

permissions:
  contents: read

jobs:
  p17-6-cli:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest

      - name: Run full candidate suite
        env:
          PYTHONPATH: src
        run: pytest -q

# diagnostic push trigger: full-suite telemetry
