name: EXP-19 Vector #4 Topology Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  vector4-topology-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-mock
      - name: Run EXP-19 Vector #4 topology audit
        env:
          PYTHONPATH: .:src
        run: |
          pytest -q tests/research/exp19/ci_index_payload_topology_audit.py -s 2>&1 | tee exp19-index-payload-topology.txt
      - name: Upload Vector #4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp19-index-payload-topology
          path: exp19-index-payload-topology.txt
          if-no-files-found: error
