name: Research Validation

on:
  push:
    branches:
      - 'feature/p19-3-research-artifact'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install research test dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-mock
    - name: Run architectural boundary validation
      env:
        PYTHONPATH: src
      run: |
        pytest -q tests/test_architectural_boundaries.py
    - name: Run P19.1-P19.3 research regression suite
      env:
        PYTHONPATH: src
      run: |
        pytest -q tests/research/test_artifact.py tests/research/test_causal.py
