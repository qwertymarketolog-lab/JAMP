name: MCP Guard Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-guard-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JAMP
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run MCP Guard simulation
        run: python experiments/mcp_guard/run_guard_experiment.py
