name: EXP-21 GC Intervention Boundary

on:
  push:
    branches:
      - research/exp21-gc-intervention-boundary
  pull_request:
    branches:
      - main

jobs:
  gc-intervention:
    runs-on: ubuntu-latest
    env:
      TARGET_COMMIT: 8c6b6a40f019d727a1ef630975a2691a390affd6
      PYTHONPATH: .:src
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize probe before target checkout
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git show "$WORKFLOW_SHA:scripts/research/exp21/gc_intervention_boundary.py" > "$RUNNER_TEMP/gc_intervention.py"

      - name: Checkout exact target commit
        run: |
          git checkout --detach "$TARGET_COMMIT"
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"

      - name: Verify Frozen Core
        run: |
          test "$(git hash-object src/jamp/run.py)" = "0fee0e1c5c1a1548361965ac51eacdeba62bfe8a"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-mock

      - name: Run GC intervention experiment
        run: python "$RUNNER_TEMP/gc_intervention.py"

      - name: Validate terminal artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/research/exp21_gc_intervention_boundary.json")
          d=json.loads(p.read_text())
          assert d["status"]=="VERIFIED"
          assert d["target_commit"]=="8c6b6a40f019d727a1ef630975a2691a390affd6"
          assert d["frozen_core_blob"]=="0fee0e1c5c1a1548361965ac51eacdeba62bfe8a"
          assert d["workload_definition_hash"]=="f8875a20af579bd102afaf064dbcc435cc3e6a4b82e2b28829af9ba4b2072f92"
          assert d["n"]==40
          assert len(d["paired_rows"])==40
          assert all(r["gc_enabled_after"] for r in d["rows"])
          assert all(r["gc_enabled_during"] is False for r in d["rows"] if r["condition"]=="gc_intervention")
          assert all(r["gc_enabled_during"] is True for r in d["rows"] if r["condition"]=="control")
          assert all(r["gc_thresholds_after"] == [700,10,10] for r in d["rows"])
          PY

      - name: Upload terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp21-gc-intervention-boundary
          path: artifacts/research/exp21_gc_intervention_boundary.json
          if-no-files-found: error
