name: EXP-21 Phase 3 Dispatch Bootstrap

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Exact Phase 3 commit SHA to execute"
        required: true
        type: string
      pairs:
        description: "Required paired observations"
        required: false
        default: "30"
        type: string

jobs:
  execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Phase 3 dependencies
        run: python -m pip install -e . scipy

      - name: Verify target commit identity
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: test "$TARGET_COMMIT" = "$(git rev-parse HEAD)"

      - name: Run EXP-21 Phase 3
        env:
          PYTHONPATH: .:src
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          python scripts/research/exp21/phase3_topology.py \
            --pairs "${{ inputs.pairs }}" \
            --target-commit "$TARGET_COMMIT"

      - name: Upload Phase 3 raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp21-phase3-topology-results
          path: artifacts/research/exp21_phase3_topology_results.json
          if-no-files-found: error
