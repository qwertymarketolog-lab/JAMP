name: Probe GHCR golithus MinIO runtime

on:
  push:
    branches:
      - probe/ghcr-golithus-minio-runtime-20261008
  workflow_dispatch:

jobs:
  minio-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Pull MinIO image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format='repo={{index .RepoTags 0}} digests={{json .RepoDigests}}'
      - name: Start MinIO
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z"
          docker run -d --name jamp-minio-probe -p 9000:9000 -p 9001:9001 "$IMAGE" server /data --console-address ":9001"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs jamp-minio-probe
          exit 1
      - name: Provenance evidence
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z"
          docker image inspect "$IMAGE" --format='{{json .Config.Labels}}'
          docker image inspect "$IMAGE" --format='repo={{index .RepoTags 0}} digests={{json .RepoDigests}}'
