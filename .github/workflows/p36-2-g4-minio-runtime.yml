name: P36.2 G4 MinIO Runtime

on:
  pull_request:
  push:
    branches: [main]

jobs:
  g4-minio-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install MinIO Server and Client
        run: |
          # MinIO Community Edition is source-only; install the server from source.
          go install github.com/minio/minio@latest
          sudo mv "$(go env GOPATH)/bin/minio" /usr/local/bin/minio

          # The official MinIO Client download remains available as a binary.
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          sudo mv /tmp/mc /usr/local/bin/mc

          minio --version
          mc --version
      - name: Start MinIO Server Background
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadminpassword
        run: |
          mkdir -p /tmp/minio-data
          nohup minio server /tmp/minio-data --console-address ":9001" > /tmp/minio.log 2>&1 &

          echo "Waiting for MinIO to start..."
          until curl -fsS http://127.0.0.1:9000/minio/health/live; do
            sleep 1
          done
          echo "MinIO is up and running!"
      - name: Configure MinIO bucket
        run: |
          mc alias set local http://127.0.0.1:9000 minioadmin minioadminpassword
          mc mb --ignore-existing local/jamp-g4
          mc anonymous set public local/jamp-g4
      - name: Run G4 runtime test
        env:
          JAMP_G4_MINIO_ENDPOINT: http://127.0.0.1:9000
          JAMP_G4_MINIO_BUCKET: jamp-g4
          JAMP_G4_EVIDENCE_PATH: artifacts/g4-runtime-evidence.json
        run: python -m pytest -q tests/test_g4_minio_runtime.py
      - name: Upload G4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-minio-runtime-evidence
          path: artifacts/g4-runtime-evidence.json
          if-no-files-found: warn
