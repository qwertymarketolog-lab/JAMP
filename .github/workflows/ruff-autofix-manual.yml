name: ruff autofix (one-shot)
on:
  push:
    paths:
      - '.github/workflows/ruff-autofix-manual.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/api-key-auth
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff (pinned to CI version)
        run: python -m pip install "ruff==0.17.3"

      - name: Print version (audit)
        run: ruff --version

      - name: Format two files
        run: ruff format src/jamp/api/auth.py tests/test_api_key_auth.py

      - name: Verify check passes
        run: ruff format --check src/jamp/api/auth.py tests/test_api_key_auth.py

      - name: Commit and push if changed
        run: |
          git config user.name  "jamp-bot"
          git config user.email "jamp-bot@users.noreply.github.com"
          git add src/jamp/api/auth.py tests/test_api_key_auth.py
          if git diff --cached --quiet; then
            echo "Nothing to format"
            exit 0
          fi
          git commit -m "style(auth): apply ruff format (autofix)"
          git push origin HEAD:feat/api-key-auth
