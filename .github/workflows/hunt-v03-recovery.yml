name: The Hunt v0.3 - DeepSeek Artifact Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - "exp/hunt-v03-nemotron-recovery"
    paths:
      - ".github/workflows/hunt-v03-recovery.yml"
      - "experiments/the-hunt/v0.3/recover_v03.py"
      - "tests/test_hunt_v03_recovery.py"

permissions:
  contents: read
  actions: read

jobs:
  recover-original-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run focused recovery contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/the-hunt/v0.3/recover_v03.py tests/test_hunt_v03_recovery.py
          python -m unittest discover -s tests -p 'test_hunt_v03_recovery.py' -v

      - name: Download and verify immutable DeepSeek artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-input/original recovery-input/wheelhouse recovery-input/download-logs recovery-output
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13347295508/zip" \
            -o recovery-input/deepseek-original.zip
          test "$(stat -c%s recovery-input/deepseek-original.zip)" = "97441836"
          printf '%s  %s\n' \
            '576c570f0d960719ccf68f16a632f373352e066e3c12f0474978659ebeeb08b5' \
            'recovery-input/deepseek-original.zip' | sha256sum --check
          unzip -q recovery-input/deepseek-original.zip -d recovery-input/original
          python experiments/the-hunt/v0.3/recover_v03.py prepare \
            --artifact-dir recovery-input/original \
            --source-zip recovery-input/deepseek-original.zip \
            --requirements recovery-input/requirements_strict.txt \
            --pins recovery-input/pins.json

      - name: Record recovery host target
        shell: bash
        run: |
          set -euo pipefail
          {
            python --version
            python -c "import platform; print(platform.python_implementation(), platform.machine(), platform.platform())"
            uname -a
          } | tee recovery-input/target-platform.txt

      - name: Download exact pinned CPython 3.11 Linux x86_64 wheels only
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r sample_id package_name version; do
            mkdir -p "recovery-input/wheelhouse/$sample_id"
            if python -m pip download --disable-pip-version-check --only-binary=:all: \
              --dest "recovery-input/wheelhouse/$sample_id" "$package_name==$version" \
              >"recovery-input/download-logs/$sample_id.log" 2>&1; then
              printf '%s\tSUCCESS\n' "$sample_id" >> recovery-input/download-status.tsv
            else
              printf '%s\tFAILED\n' "$sample_id" >> recovery-input/download-status.tsv
            fi
          done < recovery-input/requirements_strict.tsv
          python experiments/the-hunt/v0.3/recover_v03.py manifest \
            --wheelhouse recovery-input/wheelhouse \
            --pins recovery-input/pins.json \
            --download-status recovery-input/download-status.tsv \
            --output recovery-input/wheel_manifest.json

      - name: Run API Ground Truth in network-isolated per-sample environments
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="python:3.11-slim"
          docker pull "$IMAGE"
          IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          printf 'SANDBOX_IMAGE_ID=%s\n' "$IMAGE_ID" | tee recovery-output/sandbox-image.txt
          chmod -R a+rX recovery-input
          chmod -R 777 recovery-output
          mkdir -p "$RUNNER_TEMP/hunt-recovery-venvs"
          chmod 777 "$RUNNER_TEMP/hunt-recovery-venvs"
          docker run --rm \
            --network none --memory=3g --cpus=2 --pids-limit=128 \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --mount "type=bind,src=$PWD/recovery-input/original,dst=/original,readonly" \
            --mount "type=bind,src=$PWD/recovery-input/wheelhouse,dst=/wheelhouse,readonly" \
            --mount "type=bind,src=$PWD/recovery-input,dst=/input,readonly" \
            --mount "type=bind,src=$PWD/recovery-output,dst=/output" \
            --mount "type=bind,src=$RUNNER_TEMP/hunt-recovery-venvs,dst=/venvs" \
            --mount "type=bind,src=$PWD/experiments/the-hunt/v0.3/recover_v03.py,dst=/recover_v03.py,readonly" \
            -e HOME=/tmp -e PYTHONNOUSERSITE=1 -e JAMP_VENV_ROOT=/venvs \
            -e JAMP_RECOVERY_RUN_ID="${GITHUB_RUN_ID}" \
            -e JAMP_RECOVERY_SHA="${GITHUB_SHA}" \
            -e JAMP_RECOVERY_WORKFLOW="${GITHUB_WORKFLOW}" \
            -e JAMP_SANDBOX_IMAGE_ID="$IMAGE_ID" \
            "$IMAGE" python /recover_v03.py evaluate \
              --artifact-dir /original --wheelhouse /wheelhouse \
              --pins /input/pins.json \
              --wheelhouse-manifest /input/wheel_manifest.json \
              --output-dir /output 2>&1 | tee recovery-output/recovery.log

      - name: Upload complete DeepSeek Recovery evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-v03-deepseek-recovery-${{ github.run_id }}
          path: |
            recovery-input/deepseek-original.zip
            recovery-input/original/
            recovery-input/requirements_strict.txt
            recovery-input/requirements_strict.tsv
            recovery-input/pins.json
            recovery-input/wheelhouse/
            recovery-input/download-status.tsv
            recovery-input/download-logs/
            recovery-input/target-platform.txt
            recovery-input/wheel_manifest.json
            recovery-output/
          if-no-files-found: warn
          retention-days: 90
