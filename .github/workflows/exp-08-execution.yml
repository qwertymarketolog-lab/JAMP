name: EXP-08 Execution

on:
  push:
    branches:
      - research/exp-08-mutation-resistance-execution-commit
  workflow_dispatch:

jobs:
  execution:
    name: mutation-execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install ".[dev]"

      - name: Verify execution layer
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/research/test_exp08_mutation_execution.py

      - name: Execute EXP-08 mutation corpus and emit raw observations
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          from tests.research.exp08_mutation_execution import collect_raw_observations
          import json

          observations = collect_raw_observations()
          path = Path("EXP-08-EXECUTION.md")
          lines = [
              "# EXP-08 Execution — Raw Observations",
              "",
              "This file contains raw execution output only. No A/B/C/D classification is applied here.",
              "",
          ]
          for observation in observations:
              lines.append(f"## {observation['mutation_id']}")
              lines.append("")
              lines.append("```json")
              lines.append(json.dumps(observation, ensure_ascii=False, indent=2, sort_keys=True))
              lines.append("```")
              lines.append("")
          path.write_text("\\n".join(lines), encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Upload raw EXP-08 observations
        uses: actions/upload-artifact@v4
        with:
          name: exp-08-raw-observations
          path: EXP-08-EXECUTION.md
          if-no-files-found: error
