name: P20.4 Claim Verification Diagnostic

on:
  push:
    branches: [feature/p20-4-claim-verification]
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run P20.4 contract
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/research/test_claim.py
