name: Mypy PR544 Differential Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/mypy-pr544-control-20261106
  pull_request:
    branches:
      - diagnostic/mypy-pr544-base-20261106

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Fetch exact baseline and PR head
        env:
          BASE_SHA: b94117ca4eb175895c16652ef97fcecc391a7db6
          HEAD_SHA: 6a21296faed150f947d1e5a590a3882858984ff6
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA"
          git fetch origin "$HEAD_SHA"
          test "$(git rev-parse "$BASE_SHA")" = "$BASE_SHA"
          test "$(git rev-parse "$HEAD_SHA")" = "$HEAD_SHA"
      - name: Install developer dependencies from baseline
        run: |
          set -euo pipefail
          git checkout --detach b94117ca4eb175895c16652ef97fcecc391a7db6
          python -m pip install ".[dev]"
          python --version
          mypy --version
      - name: Run identical Mypy checks on baseline and PR head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mypy-pr544
          cat > artifacts/mypy-pr544/metadata.txt <<'EOF'
          BASELINE_SHA=b94117ca4eb175895c16652ef97fcecc391a7db6
          PR_HEAD_SHA=6a21296faed150f947d1e5a590a3882858984ff6
          PYTHON_VERSION=3.11
          CONFIG=pyproject.toml
          FILES=src/jamp/api/app.py src/jamp/db/verdicts.py src/jamp/runtime/persistence.py src/jamp/runtime/provenance.py
          EOF
          python --version >> artifacts/mypy-pr544/metadata.txt
          mypy --version >> artifacts/mypy-pr544/metadata.txt

          set +e
          git checkout --detach b94117ca4eb175895c16652ef97fcecc391a7db6
          MYPYPATH=src mypy --config-file=pyproject.toml \
            src/jamp/api/app.py \
            src/jamp/db/verdicts.py \
            src/jamp/runtime/persistence.py \
            src/jamp/runtime/provenance.py \
            > artifacts/mypy-pr544/base.log 2>&1
          BASE_EXIT=$?

          git checkout --detach 6a21296faed150f947d1e5a590a3882858984ff6
          MYPYPATH=src mypy --config-file=pyproject.toml \
            src/jamp/api/app.py \
            src/jamp/db/verdicts.py \
            src/jamp/runtime/persistence.py \
            src/jamp/runtime/provenance.py \
            > artifacts/mypy-pr544/head.log 2>&1
          HEAD_EXIT=$?
          set -e

          printf 'BASE_EXIT=%s\nHEAD_EXIT=%s\n' "$BASE_EXIT" "$HEAD_EXIT" \
            | tee -a artifacts/mypy-pr544/metadata.txt

          python - <<'PY'
          import collections
          import pathlib
          import re

          root = pathlib.Path("artifacts/mypy-pr544")
          pattern = re.compile(
              r"^(.+?):(\d+)(?::(\d+))?: error: (.*?)(?:  \[([^\]]+)\])?$",
              re.MULTILINE,
          )

          def parse(path):
              text = path.read_text(errors="replace")
              rows = []
              for file, line, column, message, code in pattern.findall(text):
                  rows.append({
                      "file": file,
                      "line": int(line),
                      "column": int(column) if column else None,
                      "message": message,
                      "code": code or "NO_CODE",
                  })
              return rows

          base_rows = parse(root / "base.log")
          head_rows = parse(root / "head.log")

          def identity(row):
              return (row["file"], row["message"], row["code"])

          base_counts = collections.Counter(identity(row) for row in base_rows)
          head_counts = collections.Counter(identity(row) for row in head_rows)
          introduced = head_counts - base_counts
          resolved = base_counts - head_counts

          def render(title, counts, rows):
              lines = [title]
              for key, count in sorted(counts.items()):
                  matching = [r for r in rows if identity(r) == key]
                  locations = ", ".join(
                      f'{r["line"]}:{r["column"] or 0}' for r in matching
                  )
                  lines.append(
                      f'{count}x {key[0]} [{key[2]}] {key[1]} (line(s): {locations})'
                  )
              return lines + (["none"] if not counts else [])

          report = [
              "MYPY DIFFERENTIAL REPORT",
              "BASELINE_SHA=b94117ca4eb175895c16652ef97fcecc391a7db6",
              "PR_HEAD_SHA=6a21296faed150f947d1e5a590a3882858984ff6",
              f"X_BASELINE_ERRORS={len(base_rows)}",
              f"PR_TOTAL_ERRORS={len(head_rows)}",
              f"Y_INTRODUCED_ERRORS={sum(introduced.values())}",
              f"RESOLVED_ERRORS={sum(resolved.values())}",
              "",
          ]
          report += render("=== NEW DIAGNOSTICS (normalized by file/message/code) ===", introduced, head_rows)
          report += ["", *render("=== RESOLVED DIAGNOSTICS (normalized by file/message/code) ===", resolved, base_rows)]
          output = "\n".join(report) + "\n"
          (root / "comparison.txt").write_text(output)
          print(output)
          PY
      - name: Upload differential Mypy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-pr544-differential
          path: artifacts/mypy-pr544/
          if-no-files-found: error
