name: P20.2 Diagnostic

on:
  push:
    branches:
      - feature/p20-2-cross-trajectory-composition
  workflow_dispatch:

jobs:
  p20-2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run P20.2 acceptance gates
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/research/test_composition.py
