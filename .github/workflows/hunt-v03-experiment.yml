name: The Hunt v0.3 - Real LLM Experiment

on:
  workflow_dispatch:
    inputs:
      groq_model:
        description: Exact Groq model ID to use; it is recorded in the generation manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate pinned model input
        env:
          GROQ_MODEL: ${{ inputs.groq_model }}
        run: |
          set -euo pipefail
          if [[ -z "${GROQ_MODEL//[[:space:]]/}" ]]; then
            echo "::error::workflow_dispatch input groq_model must not be empty"
            exit 1
          fi
          printf 'Pinned Groq model: %s\n' "$GROQ_MODEL"

      - name: 1. Generate Ground Truth (PyPI)
        run: |
          set -euo pipefail
          python experiments/the-hunt/v0.3/verify_gt_v3.py \
            --prompts experiments/the-hunt/v0.3/data/prompts.json \
            --ground-truth experiments/the-hunt/v0.3/data/ground_truth_v3.json

      - name: 2. Generate Real LLM Responses (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.groq_model }}
        run: |
          set -euo pipefail
          python experiments/the-hunt/v0.3/run_llm_v3.py \
            --prompts experiments/the-hunt/v0.3/data/prompts.json \
            --responses experiments/the-hunt/v0.3/data/llm_responses_v3.json \
            --manifest experiments/the-hunt/v0.3/data/generation_manifest.json

      - name: 3. Paired Evaluation (JAMP vs Baseline)
        run: |
          set -euo pipefail
          python experiments/the-hunt/v0.3/evaluate_v0.3.py \
            --input experiments/the-hunt/v0.3/data/llm_responses_v3.json \
            --manifest experiments/the-hunt/v0.3/data/generation_manifest.json \
            --ground-truth experiments/the-hunt/v0.3/data/ground_truth_v3.json \
            --output experiments/the-hunt/v0.3/results/results_v0.3.json

      - name: Upload Full Evidence Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-hunt-v0.3-evidence
          path: experiments/the-hunt/v0.3/
          if-no-files-found: warn
          retention-days: 90
