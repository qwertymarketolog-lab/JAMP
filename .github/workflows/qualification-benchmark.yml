name: Qualification Benchmark

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-qualification-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_ID_MAP: '{"am/nemotron-3-super-120b-a12b":"z-ai/glm-5.3-flash"}'
      JAMP_ENVIRONMENT: local
      JAMP_SIGNING_KEY: ${{ secrets.JAMP_SIGNING_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install httpx

      - name: Validate signing secret configuration
        env:
          JAMP_SIGNING_KEY: ${{ secrets.JAMP_SIGNING_KEY }}
        run: |
          if [ -z "$JAMP_SIGNING_KEY" ]; then
            echo "::error::JAMP_SIGNING_KEY repository secret is not configured."
            exit 1
          fi

      - name: Run live benchmark
        id: benchmark
        run: python experiments/qualification_benchmark/run_benchmark.py

      - name: Upload measured benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-benchmark-evidence
          path: src/jamp/runtime/measured_benchmarks.json
          if-no-files-found: error
          retention-days: 30

      - name: Create Pull Request with measured benchmark
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(benchmark): update measured qualifications"
          title: "Auto-update: Qualification Benchmark Results"
          body: |
            Автоматический PR с результатами последнего live-бенчмарка.
            Проверьте score, model identity, E2 evidence и dataset digest перед merge.
            Мердж PR — отдельное человеческое решение; workflow не изменяет main напрямую.
          branch: auto-benchmark-update
          base: main
          add-paths: src/jamp/runtime/measured_benchmarks.json
