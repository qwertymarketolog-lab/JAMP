name: EXP-22 Phase 0 Measurement Boundary

on:
  pull_request:
    branches:
      - main

jobs:
  phase0:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run EXP-22 Phase 0
        env:
          PYTHONPATH: .:src
          RUNNER_NAME: ${{ runner.name }}
        run: |
          python scripts/research/exp22/phase0_measurement_boundary.py \
            --target-commit "${{ github.event.pull_request.head.sha }}" \
            --output-artifact artifacts/research/exp22_phase0_evidence.json

      - name: Upload EXP-22 Phase 0 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: exp22-phase0-measurement-boundary
          path: artifacts/research/exp22_phase0_evidence.json
          if-no-files-found: error
