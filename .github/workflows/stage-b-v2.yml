name: Stage B v2 Targeted

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "false = catalog preflight only; true = send exactly four targeted model requests"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jamp-stage-b-v2-targeted
  cancel-in-progress: false

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Catalog preflight (no model requests)
        if: ${{ inputs.execute == false }}
        env:
          ANYMODEL_API_KEY: ${{ secrets.ANYMODEL_API_KEY }}
        run: python scripts/research/stage_b_v2_targeted.py

      - name: Preflight and execute targeted experiment
        if: ${{ inputs.execute == true }}
        env:
          ANYMODEL_API_KEY: ${{ secrets.ANYMODEL_API_KEY }}
        run: python scripts/research/stage_b_v2_targeted.py --execute

      - name: Upload raw and derived evidence
        if: always() && inputs.execute == true
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-v2-evidence-${{ github.run_id }}
          path: artifacts/research/stage_b_v2/
          if-no-files-found: warn
          retention-days: 90
