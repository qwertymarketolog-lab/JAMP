name: P20.1 Diagnostic

on:
  push:
    branches:
      - feature/p20-1-artifact-registry
  workflow_dispatch:

jobs:
  p20-1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run P20.1 acceptance gates
        run: python -m pytest -q tests/research/test_registry.py
