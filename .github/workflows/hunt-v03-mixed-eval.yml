name: The Hunt v0.3 - Mixed Temporal Replay

on:
  push:
    branches:
      - exp/hunt-v0.3.2-metrics-fix
    paths:
      - ".github/workflows/hunt-v03-mixed-eval.yml"
      - "experiments/the-hunt/v0.3/run_mixed_eval.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mixed-temporal-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve immutable artifact metadata
        id: artifact-metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = "qwertymarketolog-lab/JAMP"
          token = os.environ["GH_TOKEN"]
          artifacts = {
              "source": 13257610773,
              "recovery": 13299716958,
          }
          outputs = []
          for label, artifact_id in artifacts.items():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  metadata = json.load(response)
              if metadata.get("expired"):
                  raise RuntimeError(f"artifact {artifact_id} is expired")
              run_id = metadata.get("workflow_run", {}).get("id")
              name = metadata.get("name")
              if not isinstance(run_id, int) or not isinstance(name, str):
                  raise RuntimeError(f"artifact metadata incomplete: {artifact_id}")
              outputs.extend(
                  [f"{label}_run_id={run_id}", f"{label}_name={name}"]
              )
              print(
                  f"artifact_id={artifact_id} name={name} source_run_id={run_id}"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("\n".join(outputs) + "\n")
          PY

      - name: Download original Nemotron artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact-metadata.outputs.source_name }}
          path: mixed-eval/source
          repository: qwertymarketolog-lab/JAMP
          run-id: ${{ steps.artifact-metadata.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Download Recovery-time API Ground Truth artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact-metadata.outputs.recovery_name }}
          path: mixed-eval/recovery
          repository: qwertymarketolog-lab/JAMP
          run-id: ${{ steps.artifact-metadata.outputs.recovery_run_id }}
          github-token: ${{ github.token }}

      - name: Compile and run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            experiments/the-hunt/v0.3/signature_checker.py \
            experiments/the-hunt/v0.3/run_mixed_eval.py
          python -m unittest discover -s tests -p 'test_signature_checker.py' -v
          python -m unittest discover -s tests -p 'test_hunt_v03*.py' -v

      - name: Run MIXED_TEMPORAL evaluation
        shell: bash
        run: |
          set -euo pipefail
          python experiments/the-hunt/v0.3/run_mixed_eval.py \
            --source-artifact mixed-eval/source \
            --recovery-artifact mixed-eval/recovery \
            --output mixed-eval/results_mixed.json \
            2>&1 | tee mixed-eval/run.log
          printf '\n=== MIXED TEMPORAL SUMMARY ===\n'
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("mixed-eval/results_mixed.json").read_text())
          for key in (
              "evaluation_mode",
              "false_positives",
              "true_positives",
              "true_positive_evaluation_possible",
              "true_positive_ground_truth_denominator",
              "inconclusive",
              "qualification",
          ):
              print(f"{key}={report[key]}")
          PY

      - name: Capture immutable CI metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'github_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'frozen_core_blob=%s\n' "$(git rev-parse "$GITHUB_SHA:src/jamp/run.py")"
            printf 'frozen_core_expected=%s\n' \
              '0fee0e1c5c1a1548361965ac51eacdeba62bfe8a'
          } > mixed-eval/ci-metadata.txt

      - name: Upload MIXED_TEMPORAL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-v03-mixed-temporal-${{ github.run_id }}
          path: mixed-eval/
          if-no-files-found: warn
          retention-days: 90
