name: EXP-04 4-Queens

on:
  push:
    branches:
      - feature/exp-04-4queens

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact experiment commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-mock

      - name: Verify frozen Run Core
        env:
          EXPECTED_RUN_BLOB: 0fee0e1c5c1a1548361965ac51eacdeba62bfe8a
        run: |
          actual="$(git rev-parse HEAD:src/jamp/run.py)"
          test "$actual" = "$EXPECTED_RUN_BLOB"
          echo "Run Core blob: $actual"

      - name: Run EXP-04 tests
        env:
          PYTHONPATH: src:tests/research
        run: |
          python -m pytest -q tests/research/test_exp04_4queens.py | tee exp04-test-output.txt

      - name: Record execution metadata
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "run_core_blob=$(git rev-parse HEAD:src/jamp/run.py)"
            echo "command=PYTHONPATH=src:tests/research python -m pytest -q tests/research/test_exp04_4queens.py"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat exp04-test-output.txt
          } | tee exp04-execution.txt

      - name: Upload EXP-04 execution artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp-04-4queens-execution
          path: exp04-execution.txt
          if-no-files-found: error
