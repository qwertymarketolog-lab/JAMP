name: Frontend Build

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "Dockerfile"
      - "src/jamp/server/web/routes.py"
      - "src/jamp/api/app.py"
      - "tests/test_dashboard_web.py"
      - ".github/workflows/frontend-build.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "Dockerfile"
      - "src/jamp/server/web/routes.py"
      - "src/jamp/api/app.py"
      - "tests/test_dashboard_web.py"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Setup Python for Playwright API fixture
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies for E2E fixture
        run: python -m pip install -e .
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Build production Docker image with React assets
        run: docker build --tag jamp-dashboard-integration:test .
