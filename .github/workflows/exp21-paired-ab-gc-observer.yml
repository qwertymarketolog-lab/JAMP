name: EXP-21 Paired A/B GC Observer Boundary

on:
  push:
    branches:
      - research/exp21-paired-ab-gc-observer
  pull_request:
    branches:
      - main

jobs:
  paired-ab:
    runs-on: ubuntu-latest
    env:
      TARGET_COMMIT: 8c6b6a40f019d727a1ef630975a2691a390affd6
      PYTHONPATH: .:src
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize probe before target checkout
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git show "$WORKFLOW_SHA:scripts/research/exp21/paired_ab_gc_observer.py" > "$RUNNER_TEMP/paired.py"

      - name: Checkout exact target commit
        run: |
          git checkout --detach "$TARGET_COMMIT"
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"

      - name: Verify Frozen Core
        run: |
          test "$(git hash-object src/jamp/run.py)" = "0fee0e1c5c1a1548361965ac51eacdeba62bfe8a"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-mock

      - name: Run paired A/B experiment
        run: |
          python "$RUNNER_TEMP/paired.py"

      - name: Validate terminal artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/research/exp21_paired_ab_gc_observer.json")
          d=json.loads(p.read_text())
          assert d["status"]=="VERIFIED"
          assert d["target_commit"]=="8c6b6a40f019d727a1ef630975a2691a390affd6"
          assert d["frozen_core_blob"]=="0fee0e1c5c1a1548361965ac51eacdeba62bfe8a"
          assert d["n"]==40
          assert d["workload_definition_hash"]=="f8875a20af579bd102afaf064dbcc435cc3e6a4b82e2b28829af9ba4b2072f92"
          assert len(d["paired_rows"])==40
          assert all(r["condition"] in {"observer_off","observer_on"} for r in d["rows"])
          assert all(r["callback_restored"] for r in d["rows"] if r["condition"]=="observer_on")
          PY

      - name: Upload paired evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp21-paired-ab-gc-observer
          path: artifacts/research/exp21_paired_ab_gc_observer.json
          if-no-files-found: error
