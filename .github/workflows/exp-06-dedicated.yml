name: EXP-06 Dedicated Verification

on:
  push:
    branches: [feature/exp-06-parallel-frontier]
  workflow_dispatch:

jobs:
  exp-06:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install isolated developer environment
        run: python -m pip install ".[dev]"
      - name: Run EXP-06 dedicated tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/research/test_exp06_parallel_frontier.py
