name: Audit P19.1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  p19-1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact P19.1 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run P19.1 canonical tests
        env:
          PYTHONPATH: src
        run: pytest -q src/jamp/tests/test_canonical.py
