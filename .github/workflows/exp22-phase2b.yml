name: EXP-22 Phase 2B (CPU Affinity Profiling)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/research/exp22/phase2b_affinity_profiling.py'
      - '.github/workflows/exp22-phase2b.yml'

jobs:
  affinity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install scipy

      - name: Run Phase 2B
        env:
          PYTHONPATH: .:src
          RUNNER_NAME: ${{ runner.name }}
        run: |
          python scripts/research/exp22/phase2b_affinity_profiling.py             --target-commit "${{ github.event.pull_request.head.sha }}"             --seed 2202

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: exp22-phase2b-affinity
          path: artifacts/research/exp22_phase2b_affinity.json
          if-no-files-found: error
