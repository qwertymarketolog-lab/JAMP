name: Research Loop v0 Gate (main)

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  research-loop-main:
    name: Research Loop v0 Gate (main) /
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runner test dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Verify exact target SHA and Frozen Core
        id: core
        env:
          EXPECTED_CORE_BLOB: 0fee0e1c5c1a1548361965ac51eacdeba62bfe8a
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$GITHUB_SHA"
          actual_core="$(git rev-parse HEAD:src/jamp/run.py)"
          echo "target_sha=$actual_head"
          echo "frozen_core_blob=$actual_core"
          test "$actual_core" = "$EXPECTED_CORE_BLOB"

      - name: Run state-machine contracts on merge commit
        id: contract_tests
        env:
          PYTHONPATH: .agents/runner
        run: |
          set -o pipefail
          pytest -q \
            .agents/runner/test_loop_contract.py \
            .agents/runner/test_ci_zero_job_lineage.py \
            .agents/runner/test_ai_provider.py 2>&1 | tee research-loop-main-pytest.log

      - name: Record main execution evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          TEST_OUTCOME: ${{ steps.contract_tests.outcome }}
          EXPECTED_CORE_BLOB: 0fee0e1c5c1a1548361965ac51eacdeba62bfe8a
          JOB_NAME: Research Loop v0 Gate (main) /
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          request = Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=30) as response:
              jobs = json.load(response)["jobs"]
          matches = [job for job in jobs if job.get("name") == os.environ["JOB_NAME"]]
          if len(matches) != 1:
              raise SystemExit(f"expected one current job, found {len(matches)}")
          try:
              core_blob = subprocess.check_output(
                  ["git", "rev-parse", "HEAD:src/jamp/run.py"], text=True
              ).strip()
          except subprocess.CalledProcessError:
              core_blob = None
          evidence = {
              "schema": "jamp-main-research-loop-evidence-v1",
              "record_type": "execution_record_not_terminal_verdict",
              "scope": "MAIN_PUSH",
              "repository": repository,
              "event": os.environ["EVENT_NAME"],
              "ref": os.environ["TARGET_REF"],
              "target_sha": os.environ["TARGET_SHA"],
              "run_id": int(run_id),
              "job_id": matches[0]["id"],
              "job_name": os.environ["JOB_NAME"],
              "core_step_outcome": os.environ["CORE_OUTCOME"],
              "tests_step_outcome": os.environ["TEST_OUTCOME"],
              "frozen_core_blob": core_blob,
              "expected_frozen_core_blob": os.environ["EXPECTED_CORE_BLOB"],
              "frozen_core_matches": core_blob == os.environ["EXPECTED_CORE_BLOB"],
          }
          output = Path("main-evidence")
          output.mkdir(exist_ok=True)
          (output / "research-loop-main-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload main execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-loop-v0-main-evidence
          path: |
            main-evidence/research-loop-main-evidence.json
            research-loop-main-pytest.log
          if-no-files-found: error
