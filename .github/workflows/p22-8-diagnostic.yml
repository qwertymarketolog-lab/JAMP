name: P22.8 Hypothesis Formation Diagnostic

on:
  push:
    branches:
      - feature/p22-8-hypothesis-formation

permissions:
  contents: write

jobs:
  p22-8-diagnostic:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Set up CPython 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Ensure duplicate evidence gate is committed
        run: |
          if ! grep -q 'def test_hypothesis_rejects_duplicate_evidence_refs' tests/research/test_hypothesis_formation.py; then
            cat >> tests/research/test_hypothesis_formation.py <<'EOF'


def test_hypothesis_rejects_duplicate_evidence_refs():
    record = _evidence()
    with pytest.raises(ValueError, match="duplicate"):
        hypothesis.Hypothesis((record.evidence_hash, record.evidence_hash), STATE, P, 0)
EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/research/test_hypothesis_formation.py
            git commit -m "P22.8: add duplicate evidence gate"
            git push origin HEAD:feature/p22-8-hypothesis-formation
          fi
      - name: Run isolated P22.8 contract
        run: python -m pytest -q tests/research/test_hypothesis_formation.py
