name: Ephemeral R07 Runtime Evidence v1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ephemeral-r07-runtime.yml"

permissions:
  contents: read

jobs:
  r07-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: 56e8676114c91a1384334e8297ecda8902f5485f

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Run 25-model R07 probe
        env:
          ANYMODEL_API_KEY: ${{ secrets.ANYMODEL_API_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          import requests

          TARGET = "56e8676114c91a1384334e8297ecda8902f5485f"
          CANDIDATES = [
              "ag/gemini-2.5-flash",
              "ag/gemini-3-flash",
              "ag/gemini-3.1-pro-low",
              "ag/gemini-3.7-flash-high",
              "ag/gemini-3.7-flash-low",
              "ag/gemini-3.7-flash-medium",
              "ag/gemini-pro-agent",
              "am/kimi-k3",
              "am/nemotron-3-nano-omni-30b-a3b-reasoning",
              "am/nemotron-3-super-120b-a12b",
              "am/nemotron-3-ultra-550b-a55b",
              "cc/claude-haiku-4-5-20251001",
              "cc/claude-opus-4-6",
              "cc/claude-opus-4-7",
              "cc/claude-opus-4-8",
              "cc/claude-opus-5",
              "cc/claude-sonnet-4-6",
              "cx/gpt-5.6-terra",
              "cx/gpt-5.6-terra-review",
              "cx/gpt-6-luna",
              "cx/gpt-6-luna-review",
              "glm/glm-4.7",
              "glm/glm-5.1",
              "glm/glm-5.3",
              "qwen/qwen3.7-plus",
          ]

          key = os.environ.get("ANYMODEL_API_KEY")
          if not key:
              raise SystemExit("ANYMODEL_API_KEY is required")

          headers = {"Authorization": f"Bearer {key}"}
          catalog_url = "https://anymodel.org/v1/models"
          chat_url = "https://anymodel.org/v1/chat/completions"
          catalog_response = requests.get(catalog_url, headers=headers, timeout=30)
          catalog_response.raise_for_status()
          catalog_body = catalog_response.json()
          rows = catalog_body.get("data", catalog_body)
          ids = {x.get("id") for x in rows if isinstance(x, dict) and isinstance(x.get("id"), str)}
          missing = sorted(set(CANDIDATES) - ids)
          if missing:
              raise SystemExit(f"candidate IDs missing from catalog: {missing}")

          results = []
          for i, model in enumerate(CANDIDATES, 1):
              started = time.perf_counter()
              try:
                  response = requests.post(
                      chat_url,
                      headers={**headers, "Content-Type": "application/json"},
                      json={
                          "model": model,
                          "messages": [{"role": "user", "content": "Reply with exactly: OK"}],
                          "temperature": 0,
                      },
                      timeout=30,
                  )
                  elapsed = time.perf_counter() - started
                  try:
                      body = response.json()
                  except ValueError:
                      body = {"raw_text": response.text[:4000]}
                  choices = body.get("choices") if isinstance(body, dict) else None
                  text = None
                  if isinstance(choices, list) and choices and isinstance(choices[0], dict):
                      message = choices[0].get("message")
                      if isinstance(message, dict) and isinstance(message.get("content"), str):
                          text = message["content"]
                      elif isinstance(choices[0].get("text"), str):
                          text = choices[0]["text"]
                  exact = text == "OK"
                  results.append({
                      "model_id": model,
                      "status": "VERIFIED" if exact else "INCONCLUSIVE",
                      "observed": {
                          "status_code": response.status_code,
                          "elapsed_s": elapsed,
                          "text": text,
                          "unexpected_spans": [] if exact else None,
                          "response_body": body,
                      },
                  })
              except requests.RequestException as exc:
                  results.append({
                      "model_id": model,
                      "status": "INCONCLUSIVE",
                      "observed": {
                          "error_type": type(exc).__name__,
                          "error": str(exc),
                          "unexpected_spans": None,
                      },
                  })
              print(f"[{i}/25] {model} -> {results[-1]['status']}", flush=True)

          payload = {
              "schema_version": "jamp.r07.raw_runtime_evidence.v1",
              "target_commit": TARGET,
              "probe": "R07",
              "candidate_count": len(CANDIDATES),
              "catalog_count": len(ids),
              "catalog_url": catalog_url,
              "chat_url": chat_url,
              "created_at": dt.datetime.now(dt.UTC).isoformat().replace("+00:00", "Z"),
              "raw_responses_unchanged": True,
              "results": results,
          }
          out = Path("artifacts/research/raw_r07_runtime_evidence_v1.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"WROTE {out}", flush=True)
          PY

      - name: Upload raw R07 runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: raw-r07-runtime-evidence-v1
          path: artifacts/research/raw_r07_runtime_evidence_v1.json
          if-no-files-found: error
          retention-days: 30
