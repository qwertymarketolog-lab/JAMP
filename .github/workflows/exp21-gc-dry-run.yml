name: EXP-21 GC Causality Evidence

on:
  pull_request:
    paths:
      - "scripts/research/exp_gc_causality.py"
      - ".github/workflows/exp21-gc-dry-run.yml"
      - "src/jamp/research/exp19/**"
      - "research/exp19/**"
  workflow_dispatch:
    inputs:
      n:
        description: "Number of randomized paired blocks"
        required: true
        default: "30"
        type: string

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependency
        run: python -m pip install scipy 'ruff>=0.6,<1'

      - name: Targeted Ruff check
        run: |
          ruff check scripts/research/exp_gc_causality.py
          ruff format --check scripts/research/exp_gc_causality.py

      - name: Run Phase 1B paired experiment
        env:
          TARGET_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPERIMENT_SEED: "1905"
          EXPERIMENT_N: ${{ github.event_name == 'workflow_dispatch' && inputs.n || '30' }}
        run: |
          python scripts/research/exp_gc_causality.py \
            --n "$EXPERIMENT_N" \
            --output artifacts/research/exp_gc_causality_results.json

      - name: Validate Phase 1B artifact
        env:
          TARGET_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPERIMENT_N: ${{ github.event_name == 'workflow_dispatch' && inputs.n || '30' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/research/exp_gc_causality_results.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          assert payload["n_pairs"] == int(os.environ["EXPERIMENT_N"])
          assert len(payload["workload_definition_sha256"]) == 64
          assert payload["target_commit"] == os.environ["TARGET_COMMIT"]
          assert payload["experiment_seed"] == 1905
          assert payload["analysis"]["wilcoxon"]["zero_method"] == "wilcox"
          assert payload["analysis"]["wilcoxon"]["alternative"] == "two-sided"
          assert len(payload["pairs"]) == payload["n_pairs"]
          for pair in payload["pairs"]:
              for condition in ("BASELINE", "DISABLED_HOTPATH", "THRESHOLD_HIGH"):
                  assert isinstance(pair[condition]["n_gc_gen2"], int)

          print(json.dumps({
              "target_commit": payload["target_commit"],
              "workload_definition_sha256": payload["workload_definition_sha256"],
              "n_pairs": payload["n_pairs"],
              "status": payload["status"],
              "median_delta_ms": payload["analysis"].get("median_delta_ms"),
              "p_value": payload["analysis"].get("wilcoxon", {}).get("p_value"),
          }, indent=2))
          PY

      - name: Upload Phase 1B artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp-gc-causality-results-n${{ github.event_name == 'workflow_dispatch' && inputs.n || '30' }}
          path: artifacts/research/exp_gc_causality_results.json
          if-no-files-found: error
