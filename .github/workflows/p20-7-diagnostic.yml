name: P20.7 Research Planning Diagnostic

on:
  pull_request:
    branches:
      - feature/p20-7-research-planning
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run P20.7 36-gate contract
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/research/test_planning.py
