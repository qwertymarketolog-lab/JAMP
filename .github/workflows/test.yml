name: Run Pytest

on:
  push:
    branches:
      - main
      - 'import/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    if: "${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.event.head_commit.message, 'import: assemble historical upstream') }}"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jamp_test
          POSTGRES_USER: jamp
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      JAMP_DATABASE_URL: postgresql://jamp:test@localhost:5432/jamp_test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
        pip install httpx2
        pip install pytest pytest-mock pytest-asyncio
        pip install "jsonschema>=4.23,<5"
        pip install "jcs>=0.2.1,<0.3" "hypothesis>=6,<7"
    - name: Run architectural boundary validation
      env:
        PYTHONPATH: src:.
      run: |
        pytest -q tests/test_architectural_boundaries.py
    - name: Run full test suite
      env:
        PYTHONPATH: src:.
      run: |
        pytest -q -m 'not exp19_perf'
    - name: Generate empirical P17.6 report
      env:
        PYTHONPATH: src:.
      run: |
        python -m jamp.p17.closed_loop --export-report experiment_report.json --generations 4
        python -m jamp.p17.experiment_report --verify experiment_report.json
        python -m jamp.p17.experiment_report --render experiment_report.json
    - name: Upload empirical P17.6 artifact
      uses: actions/upload-artifact@v4
      with:
        name: p17-6-experiment-report
        path: experiment_report.json
        if-no-files-found: error
