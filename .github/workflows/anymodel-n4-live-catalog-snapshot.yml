name: AnyModel N4 Live-Catalog Snapshot v1

on:
  push:
    branches:
      - research/anymodel-n4-live-catalog-v1
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target HEAD
        uses: actions/checkout@v4
        with:
          ref: e35042115942153fbc33abdaf7553d86cc78961f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Capture live catalog
        env:
          ANYMODEL_API_KEY: ${{ secrets.ANYMODEL_API_KEY }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, urllib.error, urllib.request
          from datetime import datetime, timezone

          url = "https://anymodel.org/v1/models"
          key = os.environ["ANYMODEL_API_KEY"]
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {key}",
                  "x-api-key": key,
                  "Accept": "application/json",
                  "User-Agent": "JAMP-N4-Live-Catalog-Snapshot/1.0",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  status = r.status
                  content_type = r.headers.get("content-type", "")
                  body = r.read()
          except urllib.error.HTTPError as e:
              body = e.read()
              print(f"HTTP_ERROR_STATUS={e.code}")
              print(f"HTTP_ERROR_CONTENT_TYPE={e.headers.get('content-type', '')}")
              safe_headers = {
                  k.lower(): v
                  for k, v in e.headers.items()
                  if k.lower() not in {
                      "set-cookie",
                      "authorization",
                      "proxy-authorization",
                  }
              }
              print(f"HTTP_ERROR_HEADERS={json.dumps(safe_headers, ensure_ascii=False, sort_keys=True)}")
              print(f"HTTP_ERROR_BODY_BYTES={len(body)}")
              try:
                  err = json.loads(body)
                  if isinstance(err, dict):
                      print(f"HTTP_ERROR_JSON_KEYS={sorted(err.keys())}")
                      for field in ("code", "type"):
                          if field in err:
                              print(f"HTTP_ERROR_{field.upper()}={err[field]!r}")
                      if "error" in err and isinstance(err["error"], dict):
                          nested = err["error"]
                          print(f"HTTP_ERROR_NESTED_KEYS={sorted(nested.keys())}")
                          for field in ("code", "type"):
                              if field in nested:
                                  print(f"HTTP_ERROR_NESTED_{field.upper()}={nested[field]!r}")
              except Exception:
                  print("HTTP_ERROR_BODY_CLASS=non_json")
              raise
          except Exception as e:
              print(f"REQUEST_ERROR_TYPE={type(e).__name__}")
              print(f"REQUEST_ERROR_MESSAGE={str(e)[:300]!r}")
              raise

          if status != 200:
              raise SystemExit(f"HTTP {status}")

          payload = json.loads(body)
          data = payload.get("data")
          if not isinstance(data, list):
              raise SystemExit("invalid catalog payload: data is not a list")

          ids = sorted(
              x["id"] for x in data
              if isinstance(x, dict) and isinstance(x.get("id"), str)
          )
          if len(ids) != len(set(ids)):
              raise SystemExit("duplicate model IDs")

          kimi_id = "am/kimi-k3"
          non_kimi = [x for x in ids if x != kimi_id]

          digest = hashlib.sha256(
              json.dumps(ids, ensure_ascii=False, separators=(",", ":")).encode()
          ).hexdigest()

          sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()

          artifact = {
              "schema": "anymodel-n4-live-catalog-v1",
              "status": "OBSERVED",
              "source": {
                  "endpoint": url,
                  "retrieved_at": datetime.now(timezone.utc).isoformat(),
                  "http_status": status,
                  "content_type": content_type,
              },
              "snapshot": {
                  "model_count": len(ids),
                  "model_ids": ids,
                  "digest_sha256": digest,
              },
              "derived_live_available_set": {
                  "excluded_ids": [kimi_id] if kimi_id in ids else [],
                  "model_count": len(non_kimi),
                  "model_ids": non_kimi,
                  "digest_sha256": hashlib.sha256(
                      json.dumps(non_kimi, ensure_ascii=False, separators=(",", ":")).encode()
                  ).hexdigest(),
              },
              "provenance": {
                  "checkout_commit": sha,
                  "n3_artifact_unchanged": True,
                  "audit_contract_executed": False,
              },
          }

          os.makedirs("artifacts/research", exist_ok=True)
          with open(
              "artifacts/research/anymodel_n4_live_catalog_v1.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(artifact, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"HTTP_STATUS={status}")
          print(f"CATALOG_COUNT={len(ids)}")
          print(f"LIVE_AVAILABLE_COUNT={len(non_kimi)}")
          print(f"CATALOG_DIGEST_SHA256={digest}")
          print(f"CHECKOUT_SHA={sha}")
          PY

      - name: Upload N4 snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: anymodel-n4-live-catalog-v1
          path: artifacts/research/anymodel_n4_live_catalog_v1.json
          if-no-files-found: error
