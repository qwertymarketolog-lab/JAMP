name: P23.0-B Cold Replay Diagnostic

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  p23-0-b:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run P23.0-B target telemetry
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/benchmarks/test_p23_e2e_1a.py
          tests/benchmarks/test_p23_e2e_1b_replay.py

      - name: Run structural validation gates
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/research/test_structural_validation.py

      - name: Run P22.x research gates
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/research/test_candidate_generator.py
          tests/research/test_structural_validation.py
          tests/research/test_hypothesis_lifecycle.py

      - name: Run full test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
