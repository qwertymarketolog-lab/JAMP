name: B2B Client Contract Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/b2b_client/run_b2b_client.py"
      - ".github/workflows/b2b-client-test.yml"
      - "src/jamp/api/**"
      - "src/jamp/runtime/verdict.py"

permissions:
  contents: read

jobs:
  b2b-client-contract:
    name: B2B client contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run deterministic B2B client contract
        shell: bash
        run: |
          set -o pipefail
          python experiments/b2b_client/run_b2b_client.py | tee b2b-client-result.log

      - name: Upload contract result log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2b-client-contract-result
          path: b2b-client-result.log
          if-no-files-found: error
