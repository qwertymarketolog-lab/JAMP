name: Real Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JAMP_SIGNING_KEY: ${{ secrets.JAMP_SIGNING_KEY }}
      JAMP_ENV: production
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]" uvicorn
      - name: Run real HTTP pilot
        id: pilot
        shell: bash
        run: |
          set -o pipefail
          python experiments/b2b_client/run_real_pilot.py 2>&1 | tee real-pilot.log
      - name: Upload pilot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-pilot-diagnostics-${{ github.run_id }}
          path: |
            real-pilot.log
            artifacts/real-pilot/uvicorn.log
          if-no-files-found: warn
          retention-days: 30
