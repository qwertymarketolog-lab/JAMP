name: P22.8 Contract Provenance Audit

on:
  push:
    branches:
      - feature/p22-8-hypothesis-formation

jobs:
  contract-audit:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Set up CPython 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Extract historical contract
        run: git show b08794bc9971271c2431439f6318bbfada6a485f:tests/research/test_hypothesis_formation.py > /tmp/historical.py
      - name: Collect historical and current nodes
        run: |
          python -m pytest --collect-only -q /tmp/historical.py | tee /tmp/historical_nodes.txt
          python -m pytest --collect-only -q tests/research/test_hypothesis_formation.py | tee /tmp/current_nodes.txt
      - name: Build missing-items map
        run: |
          python - <<'PY'
          from pathlib import Path
          def nodes(path):
              return [line.strip() for line in Path(path).read_text().splitlines() if line.startswith('tests/') or line.startswith('/tmp/')]
          h = nodes('/tmp/historical_nodes.txt')
          c = nodes('/tmp/current_nodes.txt')
          missing = [x for x in h if x not in set(c)]
          added = [x for x in c if x not in set(h)]
          print(f'HISTORICAL_NODE_COUNT={len(h)}')
          print(f'CURRENT_NODE_COUNT={len(c)}')
          print(f'MISSING_NODE_COUNT={len(missing)}')
          print(f'ADDED_NODE_COUNT={len(added)}')
          print('--- MISSING ITEMS MAP ---')
          print('\n'.join(missing))
          print('--- ADDED ITEMS MAP ---')
          print('\n'.join(added))
          PY
