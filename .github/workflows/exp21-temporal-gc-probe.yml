name: EXP-21 Temporal GC Probe

on:
  push:
    branches:
      - research/exp21-temporal-gc-probe
  workflow_dispatch:

jobs:
  temporal-gc-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run read-only temporal GC probe
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/research/exp21/temporal_gc_probe.py \
            --target-commit "${{ github.sha }}" \
            --laps 40 \
            --seed 2140

      - name: Validate provenance and Frozen Core
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("artifacts/research/exp21_temporal_gc_probe.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          assert data["target_commit"] == actual, "target_commit_mismatch"
          assert data["workload_spec_id"] == "EXP-21-PHASE0-G4-CANONICAL-V1"
          assert data["workload_definition_hash"] == (
              "f8875a20af579bd102afaf064dbcc435cc3e6a4b82e2b28829af9ba4b2072f92"
          )
          assert data["frozen_core_blob"] == (
              "0fee0e1c5c1a1548361965ac51eacdeba62bfe8a"
          )
          assert data["n_laps"] == 40
          assert data["status"] == "VERIFIED"
          assert not data["validation_errors"]
          print("TEMPORAL_GC_PROBE_PROVENANCE=VERIFIED")
          print(json.dumps(data["summary"], indent=2, sort_keys=True))
          PY

      - name: Upload temporal GC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp21-temporal-gc-probe
          path: artifacts/research/exp21_temporal_gc_probe.json
          if-no-files-found: error
