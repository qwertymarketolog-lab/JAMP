name: EXP-21 Temporal GC Probe

on:
  pull_request:
    paths:
      - ".github/workflows/exp21-temporal-gc-probe.yml"
      - "scripts/research/exp21/temporal_gc_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-gc-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4

      - name: Materialize probe before target checkout
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/research/exp21/temporal_gc_probe.py "$RUNNER_TEMP/temporal_gc_probe.py"

      - name: Checkout exact historical EXP-19 target
        uses: actions/checkout@v4
        with:
          ref: 8c6b6a40f019d727a1ef630975a2691a390affd6
          fetch-depth: 0

      - name: Verify target and Frozen Core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8c6b6a40f019d727a1ef630975a2691a390affd6"
          test "$(git hash-object src/jamp/run.py)" = "0fee0e1c5c1a1548361965ac51eacdeba62bfe8a"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
          python -c "import pytest; print('pytest=', pytest.__version__)"

      - name: Run exact historical temporal GC probe
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/temporal_gc_probe.py"

      - name: Validate terminal artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/research/exp21_temporal_gc_probe.json
          PYTHONPATH=src:. python - <<'PY'
          import json
          from pathlib import Path

          p = Path("artifacts/research/exp21_temporal_gc_probe.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["target_commit"] == "8c6b6a40f019d727a1ef630975a2691a390affd6"
          assert d["workload_spec_id"] == "EXP-21-PHASE0-G4-CANONICAL-V1"
          assert d["workload_definition_hash"] == "f8875a20af579bd102afaf064dbcc435cc3e6a4b82e2b28829af9ba4b2072f92"
          assert d["frozen_core_blob"] == "0fee0e1c5c1a1548361965ac51eacdeba62bfe8a"
          assert d["n_laps"] == 40
          assert len(d["rows"]) == 40
          assert [r["index"] for r in d["rows"]] == list(range(1, 41))
          assert set(d["historical_tail_indices"]) == {2, 15, 22, 35}
          assert d["status"] == "VERIFIED"
          assert not d["validation_errors"]
          print("terminal_artifact_validation=PASS")
          PY

      - name: Upload terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp21-temporal-gc-probe
          path: artifacts/research/exp21_temporal_gc_probe.json
          if-no-files-found: error
