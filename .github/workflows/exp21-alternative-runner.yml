name: EXP-21 Alternative Runner G4 Telemetry

on:
  pull_request:
    branches:
      - main
      - 'research/**'
  workflow_dispatch:

jobs:
  g4-alternative-runner:
    runs-on: windows-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record runner environment
        shell: pwsh
        run: |
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"
          python --version
          python -c "import platform; print('platform=', platform.platform()); print('machine=', platform.machine()); print('processor=', platform.processor())"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run exact G4 target telemetry
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m pytest -q -s tests/research/exp19/test_adjacency_graph.py::test_g4_large_graph_is_linear_scale

      - name: Record experiment identity
        shell: pwsh
        run: |
          git rev-parse HEAD
          git status --short
