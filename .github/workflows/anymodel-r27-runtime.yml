name: AnyModel R27 Runtime Execution

on:
  pull_request:
    paths:
      - "scripts/research/r27_evaluation_harness.py"
      - "artifacts/research/r27_provenance_probe.json"
      - ".github/workflows/anymodel-r27-runtime.yml"

permissions:
  contents: read

jobs:
  r27-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install requests

      - name: Execute R27 runtime evaluation
        env:
          ANYMODEL_API_KEY: ${{ secrets.ANYMODEL_API_KEY }}
        run: python scripts/research/r27_evaluation_harness.py --execute

      - name: Upload R27 evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r27-evaluation-v1
          path: artifacts/research/r27_evaluation_v1.json
          if-no-files-found: warn
