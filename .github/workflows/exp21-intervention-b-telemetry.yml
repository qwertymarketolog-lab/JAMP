name: EXP-21 Intervention B Descriptive Telemetry

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - research/exp21-multi-ai-federation-r0

jobs:
  telemetry-b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Frozen Core Compliance (Δ src/jamp == 0)
        env:
          BASELINE_SHA: 29ba828f7cea6e19b6a9a40f5dd9f35952c4959e
        run: |
          git fetch origin research/exp21-multi-ai-federation-r0 --depth=1
          test "$(git rev-parse origin/research/exp21-multi-ai-federation-r0)" = "$BASELINE_SHA" || {
            echo "FAIL: baseline branch moved; expected $BASELINE_SHA"
            exit 1
          }
          git diff --quiet "$BASELINE_SHA" -- src/jamp || {
            echo "FAIL: Unauthorized modification detected in src/jamp"
            exit 1
          }

      - name: Execute Intervention B Telemetry Harness (N=11 paired runs)
        run: |
          mkdir -p artifacts/exp21-b
          python scripts/research/exp21_phase2_step3_intervention_b.py | tee artifacts/exp21-b/raw_telemetry.log

      - name: Capture Provenance Metadata
        env:
          BASELINE_SHA: 29ba828f7cea6e19b6a9a40f5dd9f35952c4959e
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          script = Path("scripts/research/exp21_phase2_step3_intervention_b.py")
          payload = Path("artifacts/exp21-b/raw_telemetry.log")
          provenance = {
              "commit_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "base_sha": os.environ["BASELINE_SHA"],
              "script_sha256": hashlib.sha256(script.read_bytes()).hexdigest(),
              "payload_sha256": hashlib.sha256(payload.read_bytes()).hexdigest(),
              "utc_timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "eval_status": "NOT_EVALUATED_AUTOMATICALLY",
          }
          Path("artifacts/exp21-b/provenance.json").write_text(
              json.dumps(provenance, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Telemetry & Provenance Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exp21-b-telemetry-raw
          path: artifacts/exp21-b/
          retention-days: 14
