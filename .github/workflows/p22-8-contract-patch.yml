name: P22.8 Contract Patch

on:
  push:
    branches:
      - feature/p22-8-hypothesis-formation

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'P22.8: add duplicate evidence gate')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p22-8-hypothesis-formation
      - name: Add duplicate evidence gate
        run: |
          cat >> tests/research/test_hypothesis_formation.py <<'EOF'


def test_hypothesis_rejects_duplicate_evidence_refs():
    record = _evidence()
    with pytest.raises(ValueError, match="duplicate"):
        hypothesis.Hypothesis((record.evidence_hash, record.evidence_hash), STATE, P, 0)
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/research/test_hypothesis_formation.py
          git commit -m "P22.8: add duplicate evidence gate"
          git push origin HEAD:feature/p22-8-hypothesis-formation
