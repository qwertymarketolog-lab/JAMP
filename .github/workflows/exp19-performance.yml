name: EXP-19 Performance Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:
    branches:
      - main

jobs:
  exp19-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-mock

      - name: Record Python runtime
        run: python -c "import sys; print(sys.version)"

      - name: Run EXP-19 scale diagnostic
        env:
          PYTHONPATH: .:src
        run: |
          set -o pipefail
          pytest -q tests/research/exp19/test_performance_diagnostic.py -s 2>&1 | tee exp19-performance.txt

      - name: Run EXP-19 contractual performance test
        env:
          PYTHONPATH: .:src
        run: |
          set -o pipefail
          python -m pytest -q -m exp19_perf tests/research/exp19/test_adjacency_graph.py 2>&1 | tee exp19-contract.txt

      - name: Upload EXP-19 diagnostic and contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp19-performance-evidence
          path: |
            exp19-performance.txt
            exp19-contract.txt
          if-no-files-found: error

  cpython-frozenset-baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Benchmark frozenset construction without JAMP
        run: |
          python - <<'PY' | tee frozenset-baseline.txt
          import gc
          import statistics
          import sys
          import time

          source = set(range(20_000))
          for _ in range(10):
              frozenset(source)

          samples = []
          was_enabled = gc.isenabled()
          gc.disable()
          try:
              for _ in range(100):
                  start = time.perf_counter()
                  result = frozenset(source)
                  samples.append((time.perf_counter() - start) * 1000)
          finally:
              if was_enabled:
                  gc.enable()

          assert len(result) == 20_000
          print("python:", sys.version.replace("\\n", " "))
          print("items:", len(source))
          print("iterations: 100; warmups: 10; GC disabled during measurement")
          print(f"median_ms: {statistics.median(samples):.6f}")
          print(f"min_ms: {min(samples):.6f}")
          print(f"max_ms: {max(samples):.6f}")
          PY

      - name: Upload interpreter baseline
        uses: actions/upload-artifact@v4
        with:
          name: frozenset-baseline-python-${{ matrix.python-version }}
          path: frozenset-baseline.txt
          if-no-files-found: error

  exp19-contract-runtime-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run exact EXP-19 contract on this interpreter
        env:
          PYTHONPATH: .:src
        run: |
          set -o pipefail
          python -c "import sys; print(sys.version)"
          python -m pytest -q -m exp19_perf tests/research/exp19/test_adjacency_graph.py 2>&1 | tee exp19-contract-python-${{ matrix.python-version }}.txt

      - name: Upload contract result
        uses: actions/upload-artifact@v4
        with:
          name: exp19-contract-python-${{ matrix.python-version }}
          path: exp19-contract-python-${{ matrix.python-version }}.txt
          if-no-files-found: error
