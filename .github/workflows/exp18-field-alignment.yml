name: EXP-18 Field Alignment Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  exp18-field-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run deterministic field alignment assertions
        env:
          PYTHONPATH: .:src
        run: |
          set -o pipefail
          python -m pytest -q tests/research/exp18/test_field_alignment.py -s 2>&1 | tee exp18-field-alignment.txt

      - name: Run reference reports
        env:
          PYTHONPATH: .:src
        run: |
          set -euo pipefail
          python research/exp18/r1_runner.py synthetic
          python research/exp18/r1_runner.py organic
          python research/exp18/r1_runner.py organic --fixture=organic_sample_02.json

      - name: Upload EXP-18 alignment evidence
        uses: actions/upload-artifact@v4
        with:
          name: exp18-field-alignment-diagnostic
          path: |
            exp18-field-alignment.txt
            research/exp18/out/r1_synthetic_control_report.json
            research/exp18/out/r1_organic_report.json
            research/exp18/out/r1_organic_control_report.json
          if-no-files-found: error
