name: EXP Exact MinIO Pull

on:
  push:
    branches: [experiment/minio-exact-pull-20261008]

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Docker pull exact MinIO tag
        run: docker pull minio/minio:RELEASE.2025-09-07T16-13-09Z
      - name: Emit evidence
        if: always()
        run: |
          mkdir -p artifacts
          printf '{"image":"minio/minio:RELEASE.2025-09-07T16-13-09Z","pull":"%s"}\n' "$([[ "$?" == "0" ]] && echo PASS || echo FAIL)" > artifacts/minio-pull.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minio-exact-pull-evidence
          path: artifacts/minio-pull.json
