name: Stock Audit v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-audit-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JAMP_SIGNING_KEY: ${{ secrets.JAMP_SIGNING_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" uvicorn

      - name: Validate test-case inventory
        run: python -m pytest -q tests/test_stock_audit_v2_cases.py

      - name: Run Stock Audit v2 through real HTTP
        run: python experiments/stock_audit/run_stock_audit_v2.py

      - name: Upload Stock Audit v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-audit-v2-evidence
          path: artifacts/stock-audit-v2/
          if-no-files-found: error
          retention-days: 30
