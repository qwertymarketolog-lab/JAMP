name: G1 Trusted Lineage

on:
  workflow_run:
    workflows:
      - "Research Loop v0 Gate"
    types:
      - completed

permissions:
  actions: read
  pull-requests: read
  checks: write

jobs:
  trusted-lineage:
    runs-on: ubuntu-latest
    steps:
      - name: Verify trusted workflow boundary
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_WORKFLOW_ID: "366569738"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/research-loop-v0.yml"
          EXPECTED_EVENT: "pull_request"
          EXPECTED_JOB_NAME: "Research Loop v0 Gate /"
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}"
          run_json="$(curl --fail-with-body --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/actions/runs/${RUN_ID}")"

          python - "${run_json}" <<'PY'
          import json
          import sys

          run = json.loads(sys.argv[1])
          assert run["id"] > 0
          assert run["repository"]["full_name"] == "qwertymarketolog-lab/JAMP"
          assert run["workflow_id"] == 366569738
          assert run["path"] == ".github/workflows/research-loop-v0.yml"
          assert run["event"] == "pull_request"
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert len(run["head_sha"]) == 40
          print(f"verified run {run['id']} head_sha={run['head_sha']}")
          PY

          pr_number="$(python - "${run_json}" <<'PY'
          import json
          import sys

          run = json.loads(sys.argv[1])
          pull_requests = run.get("pull_requests", [])
          assert len(pull_requests) == 1
          print(pull_requests[0]["number"])
          PY
          )"

          pr_json="$(curl --fail-with-body --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/pulls/${pr_number}")"

          python - "${run_json}" "${pr_json}" <<'PY'
          import json
          import sys

          run = json.loads(sys.argv[1])
          pr = json.loads(sys.argv[2])
          assert pr["number"] > 0
          assert pr["base"]["ref"] == "main"
          assert pr["base"]["repo"]["full_name"] == "qwertymarketolog-lab/JAMP"
          assert pr["head"]["repo"]["full_name"] == "qwertymarketolog-lab/JAMP"
          assert pr["head"]["sha"] == run["head_sha"]
          print(
              f"verified PR #{pr['number']} current head_sha={pr['head']['sha']} "
              f"matches run {run['id']}"
          )
          PY

          jobs_json="$(curl --fail-with-body --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/actions/runs/${RUN_ID}/jobs?per_page=100")"

          python - "${run_json}" "${jobs_json}" <<'PY'
          import json
          import sys

          run = json.loads(sys.argv[1])
          jobs = json.loads(sys.argv[2])["jobs"]
          matches = [
              job for job in jobs
              if job["name"] == "Research Loop v0 Gate /"
          ]
          assert len(matches) == 1
          job = matches[0]
          assert job["run_id"] == run["id"]
          assert job["status"] == "completed"
          assert job["conclusion"] == "success"
          assert job["head_sha"] == run["head_sha"]
          print(f"verified job {job['id']} name={job['name']}")
          PY

          check_payload="$(python - "${run_json}" <<'PY'
          import json
          import sys

          run = json.loads(sys.argv[1])
          print(json.dumps({
              "name": "G1 Trusted Lineage",
              "head_sha": run["head_sha"],
              "status": "completed",
              "conclusion": "success",
              "output": {
                  "title": "G1 Trusted Lineage verified",
                  "summary": (
                      f"Trusted verification passed for workflow run {run['id']} "
                      f"on head SHA {run['head_sha']}."
                  ),
              },
          }))
          PY
          )"

          curl --fail-with-body --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             "${api}/check-runs"             -d "${check_payload}"
