name: G1 Trusted Lineage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  trusted-lineage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base revision only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify trusted lineage and artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/g1_verify.py \
            --pr-number "${{ github.event.pull_request.number }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --output g1-lineage-evidence.json

      - name: Upload G1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: g1-lineage-evidence
          path: g1-lineage-evidence.json
          if-no-files-found: error
