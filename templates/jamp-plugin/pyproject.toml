[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jamp-plugin-example"
version = "0.1.0"
description = "Template for a JAMP extension"
requires-python = ">=3.11"
dependencies = ["jamp-core>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
