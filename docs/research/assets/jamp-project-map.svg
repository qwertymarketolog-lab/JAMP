<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">JAMP — карта проекта</title><desc id="desc">Карта архитектуры, текущих возможностей, доказательных принципов, агентных уровней и дорожной карты JAMP.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041426"/><stop offset="1" stop-color="#061e32"/></linearGradient>
 <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00c8ff"/><stop offset="1" stop-color="#5a72ff"/></linearGradient>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#eaf6ff} .muted{fill:#9dbbd2;font-size:16px} .title{font-size:43px;font-weight:800} .sub{font-size:20px;fill:#b8d5e8} .h{font-size:23px;font-weight:750} .body{font-size:17px} .small{font-size:15px;fill:#b9d6e9} .panel{fill:#071d30;stroke:#167ba6;stroke-width:2} .green{stroke:#00d5a0} .purple{stroke:#9a73ff} .yellow{stroke:#f6c84a} .cyan{stroke:#19c8ff} .pill{fill:#082b41;stroke:#126f98;stroke-width:1.5}
 </style>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<path d="M40 38 L66 10 L92 38 L66 66 Z" fill="url(#head)"/><text x="112" y="48" class="title">JAMP</text><text x="112" y="76" class="sub">Проверяемые результаты. Реальные данные. Контроль ИИ.</text>
<text x="600" y="43" class="title" font-size="35">Карта проекта</text><text x="600" y="76" class="sub">От исследовательского ядра к управляемым ИИ-агентам и интеграциям</text>
<rect x="40" y="105" width="745" height="105" rx="18" class="panel cyan"/><text x="65" y="139" class="h">Главная цель</text><text x="65" y="168" class="body">Объединять модели, агентов и источники данных, выполнять задачи</text><text x="65" y="192" class="body">и выдавать результаты, которые можно проверить и воспроизвести.</text>
<rect x="805" y="105" width="755" height="105" rx="18" class="panel green"/><text x="830" y="139" class="h">Непереговорные принципы</text><text x="830" y="168" class="body">Доказательства и provenance • Fail-closed • Секреты защищены</text><text x="830" y="192" class="body">Frozen Core: src/jamp/run.py • Δ = 0 • UNKNOWN не превращается в PASS</text>
<!-- current -->
<rect x="40" y="235" width="480" height="360" rx="18" class="panel green"/><text x="65" y="273" class="h">1. Уже существует</text>
<text x="65" y="309" class="body">• Исследовательское ядро и эксперименты</text><text x="65" y="339" class="body">• Система доказательств и provenance</text><text x="65" y="369" class="body">• AnyModel: 87 моделей × 30 проверок = 2610</text><text x="65" y="399" class="body">• FastAPI: /v1/classify, /v1/execute,</text><text x="84" y="424" class="body">/v1/provenance/{trace_id}</text><text x="65" y="454" class="body">• Репозиторий, CI, тесты, артефакты</text><text x="65" y="496" class="small">Ограничения на текущем срезе:</text><text x="65" y="520" class="small">25 кандидатов AnyModel остаются HOLD/INCONCLUSIVE;</text><text x="65" y="544" class="small">часть P32-маршрутов — заглушки 501; полный</text><text x="65" y="568" class="small">производственный путь и публичный запуск не подтверждены.</text>
<!-- architecture -->
<rect x="540" y="235" width="1020" height="360" rx="18" class="panel cyan"/><text x="565" y="273" class="h">2. Целевая архитектура</text>
<rect x="565" y="300" width="210" height="125" rx="12" class="pill"/><text x="585" y="331" class="h" font-size="19">Источники</text><text x="585" y="359" class="small">YouTube • GitHub • Reddit</text><text x="585" y="383" class="small">Отзывы • CRM • маркетплейсы</text><text x="585" y="407" class="small">Разрешённые API / экспорты</text>
<path d="M780 363 H812" stroke="#27c9ff" stroke-width="4"/><path d="M804 355 L814 363 L804 371" fill="none" stroke="#27c9ff" stroke-width="4"/>
<rect x="820" y="300" width="210" height="125" rx="12" class="pill green"/><text x="840" y="331" class="h" font-size="19">Адаптеры</text><text x="840" y="359" class="small">Сбор исходных данных</text><text x="840" y="383" class="small">Проверка схемы и полноты</text><text x="840" y="407" class="small">Лимиты, ошибки, метаданные</text>
<path d="M1035 363 H1067" stroke="#27c9ff" stroke-width="4"/><path d="M1059 355 L1069 363 L1059 371" fill="none" stroke="#27c9ff" stroke-width="4"/>
<rect x="1075" y="300" width="210" height="125" rx="12" class="pill"/><text x="1095" y="331" class="h" font-size="19">Ядро JAMP</text><text x="1095" y="359" class="small">Маршрутизация моделей</text><text x="1095" y="383" class="small">Evidence Gate / provenance</text><text x="1095" y="407" class="small">Аудит и контроль доступа</text>
<path d="M1290 363 H1322" stroke="#27c9ff" stroke-width="4"/><path d="M1314 355 L1324 363 L1314 371" fill="none" stroke="#27c9ff" stroke-width="4"/>
<rect x="1330" y="300" width="205" height="125" rx="12" class="pill green"/><text x="1350" y="331" class="h" font-size="19">Результат</text><text x="1350" y="359" class="small">Отчёт + ссылки</text><text x="1350" y="383" class="small">Статус + ограничения</text><text x="1350" y="407" class="small">Trace + артефакты</text>
<rect x="565" y="450" width="970" height="112" rx="12" fill="#071a2b" stroke="#1b5273"/><text x="590" y="481" class="h" font-size="20">Контракт результата</text><text x="590" y="510" class="body">Исходные наблюдения ≠ выводы модели • Каждое важное утверждение связано с источником</text><text x="590" y="538" class="body">Недостаточно данных / ошибка / конфликт → UNKNOWN, INCONCLUSIVE, HOLD или REFUSE</text>
<!-- future and agent -->
<rect x="40" y="620" width="740" height="265" rx="18" class="panel yellow"/><text x="65" y="659" class="h">3. Будущие возможности — после проверки основы</text>
<text x="65" y="699" class="body">• Подключение внешних API и источников по одному</text><text x="65" y="731" class="body">• Анализ отзывов, вопросов, жалоб и рыночных сигналов</text><text x="65" y="763" class="body">• Сравнение моделей и контролируемые эксперименты</text><text x="65" y="795" class="body">• Мультиагентные роли: исполнитель, тестировщик, аудитор</text><text x="65" y="827" class="body">• Web/PWA → мобильный интерфейс → Research OS</text><text x="65" y="859" class="small">Это направления развития, а не утверждение, что они уже реализованы.</text>
<rect x="800" y="620" width="760" height="265" rx="18" class="panel green"/><text x="825" y="659" class="h">4. ИИ-агент: два разных назначения</text>
<rect x="825" y="680" width="340" height="80" rx="12" class="pill green"/><text x="845" y="710" class="h" font-size="19">Агент-разработчик</text><text x="845" y="736" class="small">Аудит → ветка → тесты → PR</text>
<rect x="1180" y="680" width="350" height="80" rx="12" class="pill green"/><text x="1200" y="710" class="h" font-size="19">Агент для пользователей</text><text x="1200" y="736" class="small">Источники → анализ → доказательный отчёт</text>
<text x="825" y="795" class="body">L0 Чтение и аудит → L1 Изолированные изменения → L2</text><text x="825" y="822" class="body">Разрешённые действия → L3 Плановые задачи с мониторингом</text><text x="825" y="853" class="small">Не дублировать работу • не менять Frozen Core • не сливать свой PR</text><text x="825" y="873" class="small">Первый пилот — read-only; отдельное разрешение на каждый новый уровень.</text>
<!-- roadmap -->
<rect x="40" y="910" width="1520" height="170" rx="18" class="panel purple"/><text x="65" y="949" class="h">5. Порядок движения</text>
<rect x="65" y="970" width="280" height="80" rx="12" fill="#092c45" stroke="#16baff"/><text x="85" y="999" class="h" font-size="19">Шаг 1</text><text x="85" y="1025" class="small">Подтвердить один сквозной API-путь</text>
<rect x="365" y="970" width="280" height="80" rx="12" fill="#092c45" stroke="#00d5a0"/><text x="385" y="999" class="h" font-size="19">Шаг 2</text><text x="385" y="1025" class="small">Read-only агентный пилот</text>
<rect x="665" y="970" width="280" height="80" rx="12" fill="#092c45" stroke="#f6c84a"/><text x="685" y="999" class="h" font-size="19">Шаг 3</text><text x="685" y="1025" class="small">Один источник данных, например YouTube</text>
<rect x="965" y="970" width="280" height="80" rx="12" fill="#092c45" stroke="#9a73ff"/><text x="985" y="999" class="h" font-size="19">Шаг 4</text><text x="985" y="1025" class="small">Проверить claims против исходных данных</text>
<rect x="1265" y="970" width="265" height="80" rx="12" fill="#092c45" stroke="#16baff"/><text x="1285" y="999" class="h" font-size="19">Шаг 5</text><text x="1285" y="1025" class="small">Только затем расширять доступы</text>
<rect x="40" y="1095" width="1520" height="68" rx="14" fill="#071d30" stroke="#167ba6" stroke-width="2"/><text x="65" y="1124" class="h" font-size="20">Главный критерий</text><text x="300" y="1124" class="body">Не количество функций, а реальные задачи, проверяемые доказательства и честные ограничения.</text><text x="65" y="1148" class="small">CI для изменений: Run → Job → artifact • Перед любыми изменениями проверять существующие PR • Статус карты: сводная концепция, не сертификат готовности.</text>
<text x="40" y="1188" class="small">JAMP • Карта проекта • Обновлено: 16.10.2026</text><text x="1240" y="1188" class="small">Frozen Core Δ = 0</text>
</svg>