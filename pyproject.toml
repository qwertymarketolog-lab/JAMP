[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jamp-core"
version = "0.1.0"
description = "Causal Experimental Architecture for Machine Discovery"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Eduar Leonidovich Viskunov" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["fastapi>=0.115,<1", "boto3>=1.35,<2"]

[project.scripts]
jamp-run = "jamp.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-mock>=3,<4",
  "httpx2>=2,<3",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
  "pre-commit>=3.8,<5",
  "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/qwertymarketolog-lab/JAMP"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jamp*"]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts", ".git"]

[tool.ruff.lint.per-file-ignores]
"src/jamp/domain/causal.py" = ["E", "I", "UP"]
"src/jamp/domain/consistency.py" = ["E", "I", "UP"]
"src/jamp/domain/event.py" = ["E", "I", "UP"]
"src/jamp/domain/exceptions.py" = ["E", "I", "UP"]
"src/jamp/domain/replay.py" = ["E", "I", "UP"]
"src/jamp/events/dag.py" = ["E", "I", "UP"]
"src/jamp/p17/evaluator.py" = ["E", "I", "UP"]
"src/jamp/p17/experiment_report.py" = ["E", "I", "UP"]
"src/jamp/p17/pattern_index.py" = ["E", "I", "UP"]
"src/jamp/p17/policy_event.py" = ["E", "I", "UP"]
"src/jamp/p17/policy_guided_search.py" = ["E", "I", "UP"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/jamp"]
exclude = ["^tests/", "^artifacts/"]
warn_unused_configs = true
no_site_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "exp19_perf: EXP-19 synthetic scale benchmark (non-blocking diagnostic contour)",
]
