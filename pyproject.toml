[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jamp-core"
version = "0.1.0"
description = "Causal Experimental Architecture for Machine Discovery"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Eduar Leonidovich Viskunov" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["fastapi>=0.115,<1", "jinja2>=3.1,<4", "boto3>=1.35,<2", "psycopg2-binary>=2.9.9", "httpx2>=2.11.0,<3"]

[project.scripts]
jamp-run = "jamp.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-mock>=3,<4",
  "hypothesis>=6,<7",
  "jcs>=0.2.1,<0.3",
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<2",
  "ruff==0.17.3",
  "pre-commit>=3.8,<5",
  "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/qwertymarketolog-lab/JAMP"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jamp*"]
namespaces = true

[tool.setuptools.package-data]
"jamp.db" = ["schema.sql"]
"jamp.server.web" = ["templates/*.html", "static/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "artifacts",
  ".git",
  "src/jamp/domain/causal.py",
  "src/jamp/domain/event.py",
  "src/jamp/domain/exceptions.py",
]

[tool.ruff.lint.per-file-ignores]
"src/jamp/domain/causal.py" = ["E", "I", "UP"]
"src/jamp/domain/consistency.py" = ["E", "I", "UP"]
"src/jamp/domain/event.py" = ["E", "I", "UP"]
"src/jamp/domain/exceptions.py" = ["E", "I", "UP"]
"src/jamp/domain/replay.py" = ["E", "I", "UP"]
"src/jamp/events/dag.py" = ["E", "I", "UP"]
"src/jamp/p17/evaluator.py" = ["E", "I", "UP"]
"src/jamp/p17/experiment_report.py" = ["E", "I", "UP"]
"src/jamp/p17/pattern_index.py" = ["E", "I", "UP"]
"src/jamp/p17/policy_event.py" = ["E", "I", "UP"]
"src/jamp/p17/policy_guided_search.py" = ["E", "I", "UP"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/jamp"]
exclude = ["^tests/", "^artifacts/"]
warn_unused_configs = true
no_site_packages = true

# FastAPI/Starlette imports are unavailable to Mypy with no_site_packages=true.
# Keep strict checking enabled while treating these framework imports as untyped.
[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "starlette", "starlette.*"]
ignore_missing_imports = true

# FastAPI route decorators are untyped in this configuration; scope the exception
# to the new server package only.
[[tool.mypy.overrides]]
module = ["jamp.server.*"]
disallow_untyped_decorators = false

# psycopg2 ships without inline typing; keep the exception limited to this dependency.
[[tool.mypy.overrides]]
module = ["psycopg2", "psycopg2.*"]
ignore_missing_imports = true

# FastAPI route decorators in the API package are untyped under no_site_packages.
[[tool.mypy.overrides]]
module = ["jamp.api.*"]
disallow_untyped_decorators = false

# Differential baseline: 34 pre-existing diagnostics across these legacy modules.
# The identical baseline/head run found 0 introduced and 16 resolved diagnostics.
# TODO: move this legacy typing debt into a dedicated follow-up issue and remove
# these module-level suppressions incrementally. jamp.api.app is a legacy mixed
# module touched by C5; endpoint behavior remains covered by the C5 HTTP E2E tests.
[[tool.mypy.overrides]]
module = [
  "jamp.runtime.selector",
  "jamp.runtime.classifier",
  "jamp.runtime.evidence_gate",
  "jamp.api.auth",
  "jamp.provider.ozon",
  "jamp.provider.openrouter",
  "jamp.provider.moex_verify",
  "jamp.provider.coingecko_verify",
  "jamp.provider.anymodel",
  "jamp.api.app",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "exp19_perf: EXP-19 synthetic scale benchmark (non-blocking diagnostic contour)",
]
