<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — JAMP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-950 px-4 text-slate-100">
  <main class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">
    <p class="text-xs font-semibold uppercase tracking-[0.3em] text-amber-400">JAMP / Trust Layer</p>
    <h1 class="mt-3 text-2xl font-semibold">Вход в Станцию доверия</h1>
    <p class="mt-2 text-sm leading-6 text-slate-400">Введите API key вашей организации. Ключ проверяется сервером и не сохраняется в браузерном хранилище.</p>
    <form class="mt-6 space-y-4" method="post" action="/dashboard/login">
      <label class="block text-sm text-slate-300" for="api_key">API key</label>
      <input class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 font-mono text-sm outline-none focus:border-amber-400" id="api_key" name="api_key" type="password" autocomplete="current-password" required>
      <button class="w-full rounded-lg bg-amber-400 px-4 py-3 font-semibold text-slate-950 hover:bg-amber-300" type="submit">Войти</button>
    </form>
    <p class="mt-5 text-xs text-slate-500">После проверки сервер выдаёт короткоживущую HttpOnly cookie. API key не встраивается в JavaScript.</p>
  </main>
</body>
</html>
