<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — JAMP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-950 px-4 text-slate-100">
  <main class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">
    <p class="text-xs font-semibold uppercase tracking-[0.3em] text-amber-400">JAMP / Trust Layer</p>
    <h1 class="mt-3 text-2xl font-semibold">Вход в Станцию доверия</h1>
    <p class="mt-2 text-sm leading-6 text-slate-400">
      Войдите через GitHub. Доступ разрешён только аккаунту, заранее указанному
      в конфигурации JAMP.
    </p>
    <a class="mt-6 block w-full rounded-lg bg-amber-400 px-4 py-3 text-center font-semibold text-slate-950 hover:bg-amber-300"
       href="/dashboard/oauth/start">Войти через GitHub</a>
    <p class="mt-5 text-xs text-slate-500">
      GitHub подтверждает личность. JAMP отдельно проверяет разрешённый GitHub ID
      и создаёт ограниченную по времени HttpOnly-сессию.
    </p>
  </main>
</body>
</html>
